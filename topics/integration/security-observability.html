const PAGE_DATA = {
  summary: "Enterprise customers will put your integration through a security review and expect you to diagnose problems fast. That means protecting secrets and personal data, granting least privilege, and emitting logs, metrics, and audit trails that let you answer 'what happened to record 42?' in minutes.",
  keyHeading: "What security and operations teams look for",
  keyPoints: [
    "<strong>Secrets</strong>: environment variables or a secrets manager; never in code, logs, or URLs. Support rotation.",

    "<strong>Data protection</strong>: TLS in transit, encryption at rest, minimize what you store, redact PII in logs.",
    "<strong>Structured logging</strong> with a <em>correlation ID</em> that follows a request across systems.",
    "<strong>Metrics</strong>: success/failure counts, latency, queue depth, age of oldest unprocessed item.",
    "<strong>Audit trail</strong>: who or what changed which record and when. Compliance regimes (SOC 2, HIPAA) require it.",

  template: {
    heading: "Structured logs with a correlation ID",
    label: "python",
    note: "contextvars carries the ID through code (and async tasks) without passing it everywhere.",
    code: `import json, logging, uuid
from contextvars import ContextVar

correlation_id = ContextVar("correlation_id", default="-")

class JsonFormatter(logging.Formatter):
    def format(self, record):
        return json.dumps({
            "level": record.levelname,
            "msg": record.getMessage(),
            "correlation_id": correlation_id.get(),
        })

log = logging.getLogger("integration")
handler = logging.StreamHandler()
handler.setFormatter(JsonFormatter())
log.addHandler(handler)
log.setLevel(logging.INFO)

correlation_id.set(str(uuid.uuid4())[:8])
log.info("sync started")`,

  examples: [
    {
      title: "Redacting secrets and PII before logging",
      prompt: "A log filter scrubs sensitive keys so debugging output is safe to share with a customer.",
      code: `SENSITIVE = {"password", "token", "authorization", "ssn", "api_key"}

def redact(obj):
    if isinstance(obj, dict):
        return {k: ("***" if k.lower() in SENSITIVE else redact(v)) for k, v in obj.items()}
    if isinstance(obj, list):
        return [redact(v) for v in obj]
    return obj

payload = {"user": "ada", "Authorization": "Bearer abc123",
           "profile": {"ssn": "123-45-6789", "city": "London"}}
print(redact(payload))`,
      explanation: "Redaction is recursive so nested structures are covered. Apply it centrally (a logging filter or wrapper) rather than remembering at every log call. Also avoid logging full request/response bodies by default.",
      output: "{'user': 'ada', 'Authorization': '***', 'profile': {'ssn': '***', 'city': 'London'}}",
    },
    {
      title: "Simple metrics for an integration",
      prompt: "Count outcomes and track age of the oldest pending item. These are the numbers you alert on.",
      code: `from collections import Counter

class Metrics:
    def __init__(self):
        self.counts = Counter()
        self.pending_since = {}          # item_id -> timestamp received

    def received(self, item_id, ts):
        self.pending_since[item_id] = ts

    def done(self, item_id, ok):
        self.pending_since.pop(item_id, None)
        self.counts["success" if ok else "failure"] += 1

    def oldest_pending_age(self, now):
        return max((now - t for t in self.pending_since.values()), default=0)

m = Metrics()
m.received("a", 100); m.received("b", 130)
m.done("a", ok=True)
print(dict(m.counts), m.oldest_pending_age(now=200))`,
      explanation: "'Oldest pending age' catches stuck integrations that produce no errors at all (nothing fails, nothing moves). Real systems export such numbers to Prometheus, CloudWatch, or Datadog.",
