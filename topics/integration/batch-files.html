const PAGE_DATA = {
  summary: "Many enterprise systems still exchange data as CSV, XML, or fixed-width files dropped on SFTP or a shared folder. Batch integration is high-latency but predictable, and it's often the only interface a legacy system offers. The craft is in validating rows, isolating bad ones, and making reloads safe.",
  keyHeading: "Principles for reliable batch loads",
  keyPoints: [
    "<strong>Validate every row</strong>, and collect errors instead of failing the whole file on row 1.",
    "<strong>Write rejects to a dead-letter file</strong> with the row number and reason, so the customer can fix the source data.",
    "<strong>Idempotent loads</strong>: upsert on a natural key so re-running a file doesn't duplicate rows.",
    "<strong>Stream, don't slurp</strong>: use <code>csv.DictReader</code> and chunk inserts so large files don't exhaust memory.",
    "<strong>Beware encodings and dialects</strong>: BOMs, cp1252, semicolon delimiters, quoted newlines, leading zeros lost by spreadsheets.",
    "<strong>Track the file</strong>: name, checksum, row counts in and out, so you can prove what happened.",
  ],
  template: {
    heading: "Validating rows and separating rejects",
    label: "python",
    note: "The pattern: good rows go forward, bad rows are captured with a reason.",
    code: `import csv, io

def load(text):
    good, rejects = [], []
    reader = csv.DictReader(io.StringIO(text))
    for line_no, row in enumerate(reader, start=2):        # header is line 1
        errors = []
        if not row["email"] or "@" not in row["email"]:
            errors.append("bad email")
        try:
            amount = float(row["amount"])
        except ValueError:
            errors.append("bad amount")
        if errors:
            rejects.append({"line": line_no, "errors": errors, "row": row})
        else:
            good.append({"email": row["email"].strip().lower(), "amount": amount})
    return good, rejects`,
  },
  examples: [
    {
      title: "Run it on a messy file",
      prompt: "One valid row, one bad email, one bad amount.",
      code: `import csv, io

def load(text):
    good, rejects = [], []
    for line_no, row in enumerate(csv.DictReader(io.StringIO(text)), start=2):
        errors = []
        if not row["email"] or "@" not in row["email"]:
            errors.append("bad email")
        try:
            amount = float(row["amount"])
        except ValueError:
            errors.append("bad amount")
        if errors:
            rejects.append((line_no, errors))
        else:
            good.append((row["email"].strip().lower(), amount))
    return good, rejects

data = "email,amount\\nAda@Example.com,10.5\\nnot-an-email,3\\nbob@x.com,abc\\n"
good, rejects = load(data)
print(good)
print(rejects)`,
      explanation: "The load doesn't abort on the first problem; it returns everything valid plus a precise list (line number and reason) the customer can act on. The reject report is often the most valuable deliverable of a batch integration.",
      output: "[('ada@example.com', 10.5)] / [(3, ['bad email']), (4, ['bad amount'])]",
    },
    {
      title: "Idempotent load with an upsert",
      prompt: "Running the same file twice must not create duplicates. Use a unique key and <code>ON CONFLICT</code>.",
      code: `import sqlite3

conn = sqlite3.connect(":memory:")
conn.execute("CREATE TABLE customers (email TEXT PRIMARY KEY, amount REAL)")

def upsert(rows):
    conn.executemany(
        "INSERT INTO customers (email, amount) VALUES (?, ?) "
        "ON CONFLICT(email) DO UPDATE SET amount = excluded.amount",
        rows,
    )
    conn.commit()

file_rows = [("ada@example.com", 10.5), ("bob@x.com", 7.0)]
upsert(file_rows)
upsert(file_rows)                                   # re-run the same file
upsert([("ada@example.com", 12.0)])                 # a corrected value arrives
print(conn.execute("SELECT * FROM customers ORDER BY email").fetchall())`,
      explanation: "The primary key plus <code>ON CONFLICT DO UPDATE</code> makes the load safe to repeat and lets corrected files overwrite earlier values. Parameterized placeholders (<code>?</code>) also protect against SQL injection.",
      output: "[('ada@example.com', 12.0), ('bob@x.com', 7.0)]",
    },
  ],
  gotchas: [
    "Failing the whole file on one bad row, or worse, silently skipping bad rows with no report.",
    "Reading a huge file into memory. Stream and batch.",
    "Wrong encoding: opening a cp1252 file as UTF-8 raises errors or garbles names. Detect or agree on it.",
    "Spreadsheets stripping leading zeros from IDs (00123 becomes 123). Treat IDs as strings.",
    "Picking up a file while it is still being written. Use a temp name then rename, or a done-marker file.",

        "It sorts rows",
      ],
      correct: 0,
      explanation: "Row-by-row processing scales to files larger than memory.",
    },
    {
      question: "Why treat IDs like 00123 as strings?",
      options: [
        "Numeric conversion drops leading zeros and changes the ID",
        "Strings are faster",
        "Python forbids ints",
        "IDs are always text in SQL",
      ],
      correct: 0,
      explanation: "Leading zeros are significant for many identifiers.",
    },
    {
      question: "How do you avoid reading a half-written file?",
