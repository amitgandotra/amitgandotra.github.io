const PAGE_DATA = {
  summary: "Customers run on systems built long before REST: SOAP web services, XML feeds, fixed-width mainframe exports, and databases with cryptic column names. You rarely get to replace them. Your job is to talk to them safely and translate what they say.",
  keyHeading: "What to expect and how to cope",
  keyPoints: [
    "<strong>SOAP</strong>: XML envelopes over HTTP, described by a WSDL. Libraries like <code>zeep</code> generate clients from the WSDL; underneath it's just XML you can build and parse with <code>xml.etree</code>.",
    "<strong>XML namespaces</strong> trip everyone up: element names are qualified as <code>{namespace-uri}tag</code> in ElementTree.",
    "<strong>Fixed-width files</strong> (mainframe/COBOL exports): fields defined by column positions from a spec, not by delimiters.",
    "<strong>Direct database access</strong>: prefer a read-only account against a replica or a view. Use parameterized queries. Never write into their tables unless agreed.",
    "<strong>Character encodings</strong>: cp1252, latin-1, EBCDIC. Decode explicitly with the encoding from the spec.",
    "Wrap all of it in an adapter so the weirdness stays at the edge (see Data Mapping).",
  ],
  template: {
    heading: "Building and parsing a SOAP message",
    label: "python",
    note: "SOAP is XML: construct an envelope, send it as the HTTP body, parse the XML reply.",
    code: `import xml.etree.ElementTree as ET

SOAP_NS = "http://schemas.xmlsoap.org/soap/envelope/"
ET.register_namespace("soap", SOAP_NS)

def build_request(customer_id):
    envelope = ET.Element(f"{{{SOAP_NS}}}Envelope")
    body = ET.SubElement(envelope, f"{{{SOAP_NS}}}Body")
    req = ET.SubElement(body, "GetCustomer")
    ET.SubElement(req, "Id").text = str(customer_id)
    return ET.tostring(envelope, encoding="unicode")

print(build_request(42))`,
  },
  examples: [
    {
      title: "Parsing a namespaced SOAP response",
      prompt: "Find fields inside an envelope. Note the namespace mapping passed to <code>find</code>.",
      code: `import xml.etree.ElementTree as ET

xml_text = """<soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
  <soap:Body>
    <GetCustomerResponse>
      <Name>Ada Lovelace</Name>
      <Status>ACTIVE</Status>
    </GetCustomerResponse>
  </soap:Body>
</soap:Envelope>"""

ns = {"soap": "http://schemas.xmlsoap.org/soap/envelope/"}
root = ET.fromstring(xml_text)
resp = root.find("soap:Body/GetCustomerResponse", ns)
print(resp.findtext("Name"), resp.findtext("Status"))`,
      explanation: "Without the <code>ns</code> mapping, <code>find('soap:Body')</code> raises or returns None. Also handle SOAP <code>Fault</code> elements: a 200 or 500 response can still contain an error payload that you must detect.",
      output: "Ada Lovelace ACTIVE",
    },
    {
      title: "Fixed-width records and a safe database read",
      prompt: "Parse a mainframe-style record by column positions, then look it up with a parameterized query.",
      code: `import sqlite3

# spec: cols 0-9 account id, 10-29 name, 30-37 balance in cents (zero padded)
line = "0000012345Ada Lovelace        00019950"

record = {
    "account": line[0:10].lstrip("0"),
    "name": line[10:30].strip(),
    "balance": int(line[30:38]) / 100,
}
print(record)

conn = sqlite3.connect(":memory:")
conn.execute("CREATE TABLE acct (id TEXT, status TEXT)")
conn.execute("INSERT INTO acct VALUES ('12345', 'OPEN')")
row = conn.execute("SELECT status FROM acct WHERE id = ?", (record["account"],)).fetchone()
print(row[0])`,
      explanation: "Slicing by position is the whole parser; validate the line length first in real code. The query passes the ID as a bound parameter (<code>?</code>), never interpolated into the SQL string, which prevents SQL injection and quoting bugs.",
      output: "{'account': '12345', 'name': 'Ada Lovelace', 'balance': 199.5} / OPEN",
    },
  ],
  gotchas: [
    "Forgetting XML namespaces so lookups silently return None.",
    "Treating an HTTP 200 SOAP reply as success without checking for a Fault element.",
    "String-formatting SQL for legacy databases. Use bound parameters, always.",

    {
      question: "How should IDs be passed into a SQL query on a legacy database?",
      options: [
        "As bound parameters (?)",

        "Through URL encoding",
        "Via eval",
      ],
      correct: 0,
      explanation: "Parameters prevent injection and quoting errors.",

    {
      question: "What defines fields in a fixed-width file?",

      correct: 0,
      explanation: "Each field occupies a defined range of character positions.",
    },
    {
      question: "A SOAP response has HTTP 200. Is it necessarily a success?",
      options: [
        "No, the body may contain a Fault element",
        "Yes, always",
        "Only on Tuesdays",
        "Yes if it's XML",
