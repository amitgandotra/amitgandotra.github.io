const PAGE_DATA = {
  summary: "A webhook is the other system calling you when something happens (payment succeeded, ticket updated). Because it's an inbound HTTP request from the internet, you must verify it's genuine, respond quickly, and expect duplicates and retries.",
  keyHeading: "Rules for receiving webhooks safely",
  keyPoints: [
    "<strong>Verify the signature.</strong> Providers sign the raw body with a shared secret (HMAC-SHA256). Reject anything that doesn't match. Use a constant-time comparison.",
    "<strong>Check the timestamp</strong> and reject old requests, so captured requests can't be replayed later.",
    "<strong>Respond fast (2xx)</strong>, then process asynchronously. Slow handlers cause the sender to time out and retry.",
    "<strong>Be idempotent.</strong> Providers deliver at least once. De-duplicate on the event ID.",
    "<strong>Don't trust ordering.</strong> Events can arrive out of order. Use timestamps or fetch current state.",
    "Verify against the <em>raw</em> bytes. Re-serializing parsed JSON changes whitespace and breaks the signature.",
  ],
  template: {
    heading: "Signature verification",
    label: "python",
    note: "HMAC over the timestamp and body, compared in constant time.",
    code: `import hmac, hashlib, time

SECRET = b"whsec_demo"

def sign(body: bytes, timestamp: str) -> str:
    message = timestamp.encode() + b"." + body
    return hmac.new(SECRET, message, hashlib.sha256).hexdigest()

def verify(body: bytes, timestamp: str, signature: str, tolerance=300, now=None):
    now = time.time() if now is None else now
    if abs(now - float(timestamp)) > tolerance:
        return False                                   # too old (or from the future)
    expected = sign(body, timestamp)
    return hmac.compare_digest(expected, signature)    # constant-time compare`,
  },
  examples: [
    {
      title: "Accepting valid, rejecting tampered and stale requests",
      prompt: "Exercise the verifier with three cases.",
      code: `import hmac, hashlib

SECRET = b"whsec_demo"

def sign(body, ts):
    return hmac.new(SECRET, ts.encode() + b"." + body, hashlib.sha256).hexdigest()

def verify(body, ts, sig, now, tolerance=300):
    if abs(now - float(ts)) > tolerance:
        return False
    return hmac.compare_digest(sign(body, ts), sig)

body = b'{"id":"evt_1","type":"invoice.paid"}'
ts = "1700000000"
sig = sign(body, ts)

print(verify(body, ts, sig, now=1700000010))                 # valid
print(verify(body + b" ", ts, sig, now=1700000010))          # body tampered
print(verify(body, ts, sig, now=1700009999))                 # replayed too late`,
      explanation: "Any change to the body invalidates the signature; including the timestamp in the signed message stops an attacker from re-sending an old valid request with a fresh timestamp. <code>compare_digest</code> avoids timing side channels that <code>==</code> can leak.",
      output: "True / False / False",
    },
    {
      title: "Idempotent processing by event ID",
      prompt: "Handle a duplicate delivery without double-applying it.",
      code: `processed = set()      # in production: a database table with a unique index on event_id
balance = {"total": 0}

def handle(event):
    if event["id"] in processed:
        return "duplicate ignored"
    processed.add(event["id"])
    balance["total"] += event["amount"]
    return "applied"

e = {"id": "evt_1", "amount": 50}
print(handle(e))
print(handle(e))         # provider retried the same event
print(balance)`,
      explanation: "Providers retry on any non-2xx or timeout, so the same event can arrive several times. Recording processed IDs (in a durable store with a uniqueness constraint) makes handling safe to repeat.",
      output: "applied / duplicate ignored / {'total': 50}",
    },
  ],
