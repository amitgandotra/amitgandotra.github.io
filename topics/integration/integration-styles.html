const PAGE_DATA = {
  summary: "Almost every customer engagement is an integration problem: your product has to exchange data with systems you don't control. There are four classic styles. Knowing which fits a situation (and what each costs) is the first design decision you make on site.",
  keyHeading: "The four styles and when they fit",
  keyPoints: [
    "<strong>Request/response API</strong> (REST, GraphQL, gRPC, SOAP): synchronous, simple, needs the other side up right now. Best for lookups and user-driven actions.",
    "<strong>Events / messaging</strong> (queues, pub/sub, webhooks): asynchronous, decoupled, tolerates downtime, but harder to reason about ordering and duplicates.",
    "<strong>File / batch</strong> (CSV or XML drops, SFTP): universal and often the only option for legacy systems. High latency, needs validation and reconciliation.",
    "<strong>Shared database / direct read</strong>: fastest to start, most fragile. Couples you to the other team's schema. Prefer read-only access to a replica or view.",
    "Real projects mix styles: a nightly file for history, a webhook for changes, an API for lookups.",
    "Decide by: latency needed, who owns the system, volume, what happens when either side is down, and how you'll detect a silent failure.",
  ],
  template: {
    heading: "One task, four styles",
    label: "python",
    note: "'Get a customer to the other system' expressed as the shape of each integration (simulated).",
    code: `# 1. API: call now, get an answer now
def sync_via_api(post, customer):
    return post("/customers", customer)              # blocks; caller sees success/failure

# 2. Event: publish and move on; a consumer does the work later
def sync_via_event(publish, customer):
    publish("customer.updated", customer)             # returns immediately

# 3. File: append to a batch that a scheduled job ships
def sync_via_file(rows, customer):
    rows.append(customer)                              # shipped at 02:00 tonight

# 4. Database: write straight into the other system's table (fragile)
def sync_via_db(conn, customer):
    conn.execute("INSERT INTO crm_customers VALUES (?, ?)", (customer["id"], customer["name"]))`,
  },
  examples: [
    {
      title: "Choosing a style: a small decision helper",
      prompt: "Encode the trade-offs as questions. This isn't production logic; it's a way to make the reasoning explicit in a design discussion.",
      code: `def suggest_style(needs_immediate_answer, other_side_reliable, volume_per_day, legacy_only_files):
    if legacy_only_files:
        return "file/batch"
    if needs_immediate_answer and other_side_reliable:
        return "request/response API"
    if volume_per_day > 100_000 or not other_side_reliable:
        return "events/messaging"
    return "request/response API"

print(suggest_style(True, True, 500, False))
print(suggest_style(False, False, 50, False))
print(suggest_style(False, True, 10, True))`,
      explanation: "Notice what dominates: reliability of the other side and whether an immediate answer is required. If you can't get an immediate answer from a system that is often down, a synchronous API will make your product as unreliable as their system.",
      output: "request/response API / events/messaging / file/batch",
    },
    {
      title: "Reconciliation: how you know an integration is healthy",
      prompt: "Whatever the style, compare what should have arrived with what did. Silent data loss is the worst failure mode.",
      code: `def reconcile(source_ids, target_ids):
    source, target = set(source_ids), set(target_ids)
    return {
        "missing_in_target": sorted(source - target),
        "unexpected_in_target": sorted(target - source),
        "matched": len(source & target),
    }

print(reconcile([1, 2, 3, 4], [1, 2, 4, 9]))`,
      explanation: "A scheduled reconciliation job (count, ID diff, or checksum) catches dropped messages, failed batches, and one-sided deletes that no error log will show. Build it early; customers will ask 'how do we know it's all there?'",
      output: "{'missing_in_target': [3], 'unexpected_in_target': [9], 'matched': 3}",
    },
  ],
  gotchas: [
    "Choosing the fashionable style (events) when the customer's system only supports SFTP. Start from their constraints.",
