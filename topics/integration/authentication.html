const PAGE_DATA = {
  summary: "Before any data moves, you have to prove who you are. Customers will hand you API keys, OAuth2 credentials, or service accounts, and each has different lifetimes, scopes, and failure modes. Getting authentication right (and keeping secrets out of code) is usually the first thing a security review checks.",
  keyHeading: "The mechanisms you'll meet",
  keyPoints: [
    "<strong>API key</strong>: a static secret in a header (<code>X-API-Key</code> or <code>Authorization</code>). Simple; must be stored securely and rotated.",
    "<strong>Basic auth</strong>: base64 of <code>user:password</code>. Base64 is encoding, not encryption. Only use over HTTPS.",
    "<strong>Bearer token</strong>: <code>Authorization: Bearer &lt;token&gt;</code>. Usually short-lived and obtained from an auth server.",
    "<strong>OAuth2 client credentials</strong>: machine-to-machine. Exchange client id and secret for an access token, cache it until near expiry, then refresh.",
    "<strong>OAuth2 authorization code</strong>: a user grants your app access (acting on a user's behalf); involves redirects and refresh tokens.",
    "Least privilege: request only the scopes you need. Read secrets from the environment or a vault, never from source code.",
  ],
  template: {
    heading: "Reading secrets and building headers",
    label: "python",
    note: "Secrets come from the environment; headers are built per request.",
    code: `import os
import base64

API_KEY = os.environ.get("VENDOR_API_KEY", "demo-key")     # never hard-code real keys

def api_key_headers():
    return {"X-API-Key": API_KEY}

def basic_auth_headers(user, password):
    raw = f"{user}:{password}".encode()
    return {"Authorization": "Basic " + base64.b64encode(raw).decode()}

def bearer_headers(token):
    return {"Authorization": f"Bearer {token}"}

print(basic_auth_headers("svc", "pw"))`,
  },
  examples: [
    {
      title: "Token manager for OAuth2 client credentials",
      prompt: "Fetch a token once, reuse it until shortly before it expires, then refresh. The token endpoint and clock are injected so this runs offline.",
      code: `class TokenManager:
    def __init__(self, fetch_token, now, skew=30):
        self._fetch = fetch_token       # returns {"access_token": ..., "expires_in": seconds}
        self._now = now
        self._skew = skew               # refresh a bit early to avoid edge-of-expiry failures
        self._token = None
        self._expires_at = 0

    def get(self):
        if self._token is None or self._now() >= self._expires_at - self._skew:
            data = self._fetch()
            self._token = data["access_token"]
            self._expires_at = self._now() + data["expires_in"]
        return self._token

calls = []
clock = [1000]

def fake_fetch():
    calls.append(clock[0])
    return {"access_token": f"tok-{len(calls)}", "expires_in": 300}

tm = TokenManager(fake_fetch, now=lambda: clock[0])
print(tm.get(), tm.get())        # same token, one fetch
clock[0] += 280                   # within the 30s skew of expiry
print(tm.get())                   # refreshed
print(len(calls), "token fetches")`,
      explanation: "Without caching you'd hit the auth server on every call (slow, and often rate limited). Without a skew, a token can expire mid-request. Production versions also lock around refresh so concurrent threads don't all refresh at once.",
      output: "tok-1 tok-1 / tok-2 / 2 token fetches",
    },
    {
      title: "Recovering from a 401",
      prompt: "A token can be revoked before it expires. On 401, refresh once and retry, but don't loop forever.",
      code: `def call_with_reauth(send, get_token, refresh_token):
    resp = send(get_token())
    if resp == 401:
        refresh_token()                   # force a new token
        resp = send(get_token())          # retry exactly once
    return resp

state = {"token": "old"}
def send(token):
    return 200 if token == "new" else 401

def refresh():
    state["token"] = "new"

print(call_with_reauth(send, lambda: state["token"], refresh))`,
      explanation: "Retrying exactly once distinguishes 'my token went stale' from 'my credentials are wrong'. If the second attempt is still 401, surface the error instead of retrying forever.",
      output: "200",
    },
  ],
  gotchas: [
    "Committing secrets to git. Scan history; rotate anything that leaked.",
    "Logging full headers or URLs with tokens in query strings.",
    "Treating base64 as protection. It's trivially reversible.",
    "Requesting broad scopes 'just in case'. Security reviews will flag it.",
    "Concurrent refresh storms: many threads refreshing at once. Add a lock.",
  ],

    },
    {
      question: "Why refresh a token slightly before it expires?",
      options: [
        "To avoid a request failing because the token expired in transit",
        "Because tokens must be renewed hourly by law",
        "To make tokens longer",
        "It has no benefit",
      ],
      correct: 0,
      explanation: "A small skew absorbs clock differences and network latency.",
    },
    {
      question: "How should secrets be provided to code?",
      options: [
        "Via environment variables or a secrets manager, not source code",
        "Hard-coded in a constants file",
        "In a public README",
        "In URLs",
      ],
      correct: 0,
      explanation: "Keeping secrets out of the repo makes rotation and access control possible.",
    },
    {
      question: "On a 401 with a cached token, what's a sound policy?",
      options: [
        "Refresh once and retry once; then fail clearly",
        "Retry forever",
        "Ignore it",
        "Delete the user",
      ],
      correct: 0,
      explanation: "One retry handles revoked or expired tokens without masking bad credentials.",
    },
  ],
  id: "authentication",
};
