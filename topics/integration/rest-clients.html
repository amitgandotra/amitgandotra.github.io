const PAGE_DATA = {
  summary: "Calling someone else's API is easy in a demo and hard in production. Networks time out, servers return 429 and 503, and result sets span hundreds of pages. A reliable client sets timeouts, retries only what is safe, follows pagination, and respects rate limits.",
  keyHeading: "What a production-grade client does",
  keyPoints: [
    "<strong>Always set a timeout.</strong> Python's <code>requests</code> has none by default; a hung server hangs your program forever.",
    "<strong>Retry selectively</strong>: network errors, 429, and 5xx. Not 400/401/403/404 (retrying won't fix them).",
    "<strong>Only retry safe or idempotent calls</strong> (GET, PUT, DELETE, or POST with an idempotency key). See Resilience.",
    "<strong>Respect 429</strong> and the <code>Retry-After</code> header instead of hammering.",
    "<strong>Paginate</strong>: cursor/next-link pagination is more robust than page numbers when data changes underneath you.",
    "Reuse a <code>Session</code> (connection pooling), and log status codes and durations.",
  ],
  template: {
    heading: "requests with a timeout and retry adapter",
    label: "python — needs `pip install requests`",
    note: "Not run in this page (needs network); this is the shape to copy.",
    code: `import requests
from requests.adapters import HTTPAdapter
from urllib3.util.retry import Retry

def make_session():
    session = requests.Session()
    retry = Retry(
        total=5,
        backoff_factor=0.5,                       # 0.5s, 1s, 2s, ...
        status_forcelist=[429, 500, 502, 503, 504],
        allowed_methods=["GET", "PUT", "DELETE"],  # not POST by default: not idempotent
        respect_retry_after_header=True,
    )
    session.mount("https://", HTTPAdapter(max_retries=retry))
    return session

session = make_session()
resp = session.get("https://api.example.com/orders", timeout=(3.05, 10))  # (connect, read)
resp.raise_for_status()
data = resp.json()`,
  },
  examples: [
    {
      title: "Cursor pagination as a generator",
      prompt: "Hide pagination from callers: yield items across pages until there's no next cursor. (Uses a fake API so it runs anywhere.)",
      code: `def fake_api(cursor=None):
    pages = {
        None: {"items": [1, 2, 3], "next": "c2"},
        "c2": {"items": [4, 5, 6], "next": "c3"},
        "c3": {"items": [7], "next": None},
    }
    return pages[cursor]

def iter_items(fetch):
    cursor = None
    while True:
        page = fetch(cursor)
        yield from page["items"]
        cursor = page["next"]
        if cursor is None:
            break

print(list(iter_items(fake_api)))`,
      explanation: "A generator keeps memory flat (one page at a time) and callers just write <code>for item in iter_items(...)</code>. Injecting <code>fetch</code> makes it testable and reusable for any API.",
      output: "[1, 2, 3, 4, 5, 6, 7]",
    },
    {
      title: "Honoring 429 and Retry-After",
      prompt: "When a server says slow down, wait the time it asks for. (Simulated responses; sleep is injected so the demo is instant.)",
      code: `class Resp:
    def __init__(self, status, headers=None):
        self.status_code, self.headers = status, headers or {}

def get_with_backoff(send, max_attempts=4, sleep=lambda s: None):
    waits = []
    for attempt in range(1, max_attempts + 1):
        resp = send()
        if resp.status_code != 429:
            return resp, waits
        wait = float(resp.headers.get("Retry-After", 2 ** attempt))
        waits.append(wait)
        sleep(wait)
    return resp, waits

responses = iter([Resp(429, {"Retry-After": "3"}), Resp(429), Resp(200)])
resp, waits = get_with_backoff(lambda: next(responses))
print(resp.status_code, waits)`,
      explanation: "The first 429 carries an explicit <code>Retry-After: 3</code>, so we wait 3s. The second has none, so we fall back to exponential backoff (2 ** attempt = 4s). Ignoring these signals can get your integration blocked.",
      output: "200 [3.0, 4.0]",
    },
  ],
  gotchas: [
    "No timeout: one stuck connection freezes a worker indefinitely.",
    "Retrying POST blindly can create duplicate records. Use idempotency keys.",
    "Offset pagination while data is being inserted skips or repeats records. Prefer cursors.",
    "Ignoring <code>Retry-After</code> and retrying immediately makes throttling worse.",
  ],
  gotchasHeading: "Common pitfalls",

    "Add a maximum total wait to <code>get_with_backoff</code> so it can't sleep for minutes.",
