  id: "stdlib-dsa",
  summary: "A handful of standard library tools show up in nearly every DSA pattern in this roadmap. Knowing them cold is the difference between writing ten lines of boilerplate and one import.",

    "Java: ArrayDeque for a double-ended queue. Python: <code>collections.deque</code> — O(1) appends/pops from both ends, unlike list's O(n) pop(0).",
    "Java: manually check-then-increment a HashMap&lt;K,Integer&gt; for counting. Python: <code>collections.Counter</code> — purpose-built, with .most_common() included.",
    "Java: <code>map.computeIfAbsent(key, k -&gt; new ArrayList&lt;&gt;())</code> for the 'group into buckets' pattern. Python: <code>collections.defaultdict(list)</code> — the default factory eliminates the check entirely.",

    "Java: Stream utilities and manual nested loops for combinations/permutations. Python: <code>itertools</code> — permutations(), combinations(), product(), chain() as ready-made generators.",
    "Java: no direct built-in memoization annotation. Python: <code>functools.lru_cache</code> — a decorator that adds memoization to any function in one line.",

  template: {
    note: "The imports you'll reach for constantly once you start the DSA roadmap.",
    code: `from collections import Counter, defaultdict, deque
import heapq
from itertools import permutations, combinations
from functools import lru_cache

freq = Counter("mississippi")             # {'i': 4, 's': 4, 'p': 2, 'm': 1}
groups = defaultdict(list)                 # missing keys auto-create an empty list
dq = deque([1, 2, 3])                        # O(1) appendleft/popleft
heapq.heappush([], 5)                          # min-heap operations on a plain list`,

    {
      title: "Counter + defaultdict in one pass",
      prompt: "Group words by length using defaultdict, then find the most common length with Counter.",
      code: `from collections import Counter, defaultdict

words = ["cat", "dog", "bird", "fish", "ox", "ant"]

by_length = defaultdict(list)
for w in words:
    by_length[len(w)].append(w)      # no need to check "if key exists" first
print(dict(by_length))    # {3: ['cat', 'dog', 'ant'], 4: ['bird', 'fish'], 2: ['ox']}

length_counts = Counter(len(w) for w in words)
print(length_counts.most_common(1))    # [(3, 3)] -- length 3 appears 3 times`,
      explanation: "defaultdict(list) removes the classic 'if key not in d: d[key] = []' boilerplate — accessing a missing key auto-creates the default value (here, an empty list) instead of raising KeyError. Counter accepts any iterable, including a generator expression, and tallies it directly; .most_common(n) returns the n most frequent items sorted by count, descending.",
      output: "{3: ['cat', 'dog', 'ant'], 4: ['bird', 'fish'], 2: ['ox']} / [(3, 3)]",
    },
    {
      title: "heapq for a min-heap, lru_cache for memoization",
      prompt: "Find the 3 smallest numbers with heapq, and memoize a recursive Fibonacci with lru_cache.",
      code: `import heapq
from functools import lru_cache

nums = [7, 2, 9, 1, 5, 3]
smallest_three = heapq.nsmallest(3, nums)
print(smallest_three)      # [1, 2, 3]

@lru_cache(maxsize=None)
def fib(n):
    if n <= 1:
        return n
    return fib(n - 1) + fib(n - 2)

print(fib(30))     # fast -- each fib(n) computed exactly once, then cached`,
      explanation: "heapq.nsmallest(k, iterable) is a convenience wrapper that's more efficient than sorting the whole list when k is much smaller than n. @lru_cache is a decorator (covered fully on the Functional Python page) that transparently memoizes a function's return value by its arguments — turning naive exponential recursive Fibonacci into linear time with one line added above the function, no manual memo dict required.",
