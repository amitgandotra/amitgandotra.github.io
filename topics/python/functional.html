    "Java: methods aren't values — you need a functional interface (Runnable, Function&lt;T,R&gt;) to pass behavior around, or a lambda since Java 8. Python: functions are objects from day one — assign them to variables, put them in lists, pass them as arguments, no wrapper interface needed.",

print(add(2, 3))                  # 5

def repeat(n):                       # decorator FACTORY -- returns a decorator
    def decorator(func):
        def wrapper(*args, **kwargs):
            for _ in range(n):
                func(*args, **kwargs)
        return wrapper
    return decorator

@repeat(3)
def greet():

    count = 0
    def increment():

        return count
    return increment

counter = make_counter()
print(counter())     # 1
print(counter())      # 2
print(counter())       # 3 -- count persists between calls, private to this counter instance`,
      explanation: "increment is a closure — it 'closes over' the count variable from its enclosing scope, keeping it alive and private even after make_counter() has returned. Java's lambdas can read an enclosing local variable, but only if it's 'effectively final' (never reassigned) — Java has no equivalent to nonlocal that lets a lambda mutate an outer local variable directly; you'd typically need an array or atomic wrapper as a workaround.",

      title: "Writing your own decorator",

      code: `import time
from functools import wraps

def timer(func):
    @wraps(func)                          # preserves func's name/docstring for introspection
    def wrapper(*args, **kwargs):
        start = time.perf_counter()
        result = func(*args, **kwargs)
        elapsed = time.perf_counter() - start
        print(f"{func.__name__} took {elapsed:.4f}s")
        return result
    return wrapper

@timer
def slow_sum(n):
    return sum(range(n))

slow_sum(10_000_000)`,
      explanation: "A decorator is just a function that takes a function and returns a (usually wrapped) function — @timer above def slow_sum is exactly equivalent to writing slow_sum = timer(slow_sum) right after the definition. The wrapper calls the original function, measures elapsed time around the call, and returns whatever the original returned, so decorating a function doesn't change its behavior from the caller's perspective — only adds behavior around it. @wraps(func) is a small but important detail: without it, slow_sum.__name__ would become 'wrapper' instead of 'slow_sum'.",
