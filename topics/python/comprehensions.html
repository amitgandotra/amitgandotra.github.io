const PAGE_DATA = {
  id: "comprehensions",
  summary: "List/dict/set comprehensions replace the explicit for-loop-plus-append pattern with a single, more declarative expression — the Python idiom Java developers most need to consciously adopt. Java's closest analog, Streams, is more verbose and arrived over a decade later.",

    "Java: <code>List&lt;Integer&gt; squares = new ArrayList&lt;&gt;(); for (int n : nums) squares.add(n*n);</code>. Python: <code>squares = [n*n for n in nums]</code> — one line, no explicit accumulator.",

    "Java: a Cartesian product needs nested streams or manual loops. Python: comprehensions support multiple for clauses in one expression.",

  ],
  template: {
    note: "The three comprehension shapes, plus filtering and nesting.",
    code: `nums = [1, 2, 3, 4, 5]

squares = [n * n for n in nums]                    # list comprehension
evens = [n for n in nums if n % 2 == 0]              # with a filter
pairs = [(a, b) for a in nums for b in nums if a < b]   # nested, Cartesian-ish

square_set = {n * n for n in nums}                    # set comprehension
square_map = {n: n * n for n in nums}                   # dict comprehension`,

  examples: [
    {
      title: "Comprehension vs. explicit loop",
      prompt: "Transform a list of names to their uppercase initials, only for names longer than 2 characters.",
      code: `names = ["Al", "Grace", "Ada", "Bo", "Alan"]

# explicit loop version -- what a Java developer reaches for first
result = []
for name in names:
    if len(name) > 2:
        result.append(name[0].upper())

# comprehension version -- same logic, one expression
result = [name[0].upper() for name in names if len(name) > 2]
print(result)`,
      explanation: "Both versions do exactly the same work with the same O(n) time complexity — the comprehension isn't faster in any meaningful way, it's a more direct expression of 'build a new list by transforming and filtering an existing one.' Once the pattern clicks, comprehensions read closer to the problem statement than the accumulator-loop version does.",

flat = [num for row in grid for num in row]     # flatten: outer loop first, inner loop second
print(flat)      # [1, 2, 3, 4, 5, 6, 7, 8, 9]

transposed = [[row[i] for row in grid] for i in range(len(grid[0]))]
print(transposed)    # [[1, 4, 7], [2, 5, 8], [3, 6, 9]]`,
