  summary: "Python's concurrency model has a fundamental difference from Java's that surprises every Java developer: the Global Interpreter Lock (GIL) means only one thread executes Python bytecode at a time, changing when threads, processes, and async are each the right tool. Memory management (reference counting + cyclic GC) also differs from the JVM's generational GC.",

    "Java: threads run truly in parallel across CPU cores (subject to synchronization). Python: CPython's Global Interpreter Lock (GIL) means only ONE thread executes Python bytecode at a time, even on a multi-core machine — threading gives concurrency, not parallelism, for CPU-bound code.",

    "Java: the JVM uses generational garbage collection; objects usually aren't reclaimed the instant they're unreachable. Python (CPython): primarily reference counting — an object is freed the moment its reference count hits zero, plus a periodic cyclic GC to catch reference cycles counting alone can't resolve.",

print(x is y)             # True on most CPython builds -- small ints are cached/interned
