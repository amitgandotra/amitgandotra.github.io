  summary: "Before writing any Python, get comfortable with how Python code actually runs and how dependencies get isolated per project. This is the Python-world equivalent of understanding your JDK, classpath, and Maven/Gradle setup.",

python3 -m venv .venv

# activate it (macOS/Linux)
source .venv/bin/activate

# activate it (Windows, PowerShell)
.venv\\Scripts\\Activate.ps1

# your shell prompt now shows (.venv) -- pip installs go here, not system-wide

pip freeze > requirements.txt`,

python3 -m mypackage.mymodule
