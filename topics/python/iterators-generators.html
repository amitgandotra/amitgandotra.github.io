for i in countdown(3):        # 3, 2, 1 -- computed one at a time, not all upfront
    print(i)

from contextlib import contextmanager

@contextmanager
def timer_block():
    import time
    start = time.perf_counter()
    yield                               # code inside the \`with\` block runs here
    print(f"took {time.perf_counter() - start:.4f}s")

with timer_block():

# squares_list(10_000_000) allocates ~10 million ints all at once
# squares_gen(10_000_000) allocates almost nothing until you iterate

total = sum(squares_gen(10_000_000))     # never holds more than one value at a time
