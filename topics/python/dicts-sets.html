  summary: "dict is Java's HashMap and set is Java's HashSet, but both come with literal syntax and comprehensions built directly into the language, making them far more idiomatic to construct and query on the fly.",

    "Java: <code>Map&lt;String, Integer&gt; m = new HashMap&lt;&gt;();</code> requires explicit types. Python: <code>m = {\"a\": 1, \"b\": 2}</code> — a dict literal.",
    "Java: <code>m.get(key)</code> returns null if missing; <code>.getOrDefault(key, default)</code> for a fallback. Python: <code>m[key]</code> raises KeyError if missing; <code>m.get(key, default)</code> mirrors getOrDefault; dict also has a first-class <code>in</code> operator.",
    "Java: <code>HashSet&lt;String&gt; s = new HashSet&lt;&gt;();</code>. Python: <code>s = {\"a\", \"b\", \"c\"}</code> — a set literal (note: <code>{}</code> alone is an empty dict, not an empty set).",
    "Java: iterating a HashMap via <code>.entrySet()</code> or <code>.keySet()</code>. Python: <code>for key, value in m.items():</code> — direct unpacking, no wrapper Entry objects.",
    "Java 8+: <code>Map.computeIfAbsent</code> / <code>merge</code> for default-on-missing patterns. Python: <code>collections.defaultdict</code> does this structurally, and <code>dict.setdefault()</code> is the inline equivalent.",

print("x" in seen)      # O(1) average membership check`,
