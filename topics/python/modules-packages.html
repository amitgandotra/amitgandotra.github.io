  id: "modules-packages",
  summary: "Python's import system replaces Java's package/classpath model: files are modules, folders (with an __init__.py) are packages, and pip plus a virtual environment replace Maven/Gradle's dependency resolution.",
  keyDifferences: [
    "Java: a package declaration must match its folder path exactly; the classpath tells the JVM where to find classes. Python: a file is automatically a module named after its filename; a folder becomes a package once it contains __init__.py.",
    "Java: <code>import com.company.util.StringHelper;</code> imports one class from a fully-qualified path. Python: <code>import package.module</code> imports a module; <code>from package.module import name</code> imports a specific name directly into scope.",
    "Java: Maven/Gradle resolve dependencies from Maven Central via pom.xml/build.gradle. Python: pip installs from PyPI using requirements.txt — conceptually the same job, a much simpler format.",
    "Java: a .jar bundles compiled classes for distribution. Python: a package is published to PyPI as a source/wheel distribution, installed straight into a venv's site-packages.",
    "Java: no concept of 'running a package directly' — you call a class's main(). Python: <code>if __name__ == \"__main__\":</code> is the idiom for 'only run this when the file is executed directly, not when it's imported.'",
  ],
  template: {
    note: "Module imports, package imports, and the main-guard idiom.",
    code: `import math                         # standard library module
from collections import Counter      # import one name directly

# my_package/
#   __init__.py
#   helpers.py

from my_package import helpers        # import a module from a local package
from my_package.helpers import add      # import one function directly

if __name__ == "__main__":                # only runs when this file is executed directly
    print("running as a script")`,
  },
  examples: [
    {
      title: 'The __name__ == "__main__" idiom',
      prompt: "Show why this guard matters, contrasted with Java always needing an explicit main() call.",
      code: `# file: calculator.py
def add(a, b):
    return a + b

def main():
    print(add(2, 3))

if __name__ == "__main__":
    main()`,
      explanation: 'When calculator.py is run directly (python calculator.py), Python sets the special variable __name__ to "__main__", so main() executes. When another file does import calculator instead, __name__ is set to "calculator", so the guard is False and main() does NOT run automatically — only the function/class definitions become available. Java has no equivalent ambiguity: a class either has a main() that gets called explicitly, or it doesn\'t. Python files can serve double duty as both an importable module and a runnable script, and this guard is what makes that safe.',
      output: "3 (only when run directly, not when imported)",
    },

      title: "Package structure and relative imports",

      code: `# project structure:
# myapp/
#   __init__.py
#   models.py
#   services.py

# models.py
class User:
    def __init__(self, name):
        self.name = name

# services.py
from .models import User      # relative import -- "from this same package"

def create_user(name):
    return User(name)

# main.py (outside the package)
from myapp.services import create_user
u = create_user("Ada")`,
      explanation: "The __init__.py file (even empty) is what makes Python treat the myapp/ folder as a package rather than just a plain directory, enabling myapp.services style imports. The leading dot in `from .models import User` is a relative import — it means 'the models module in my own package,' which stays correct even if the whole myapp package gets renamed or relocated, unlike an absolute import path that would need updating.",
