const PAGE_DATA = {
  id: "lists-tuples",
  summary: "Python's list is Java's ArrayList with a far friendlier API baked directly into the language. tuple has no direct Java equivalent — it's an immutable, fixed-size sequence used constantly for multiple return values and as dict keys.",
  keyDifferences: [
    "Java: <code>ArrayList&lt;Integer&gt; nums = new ArrayList&lt;&gt;();</code> requires a type parameter and boxing. Python: <code>nums = [1, 2, 3]</code> — a list literal, no type declared, can even hold mixed types.",
    "Java: arrays (<code>int[]</code>) and List are separate concepts with different syntax. Python: list is the one general-purpose sequence type used everywhere.",
    "Java: returning multiple values requires a wrapper class or an array. Python: <code>return a, b</code> returns a tuple — unpack directly at the call site.",
    "Java: List methods are <code>.add()</code>, <code>.get(i)</code>, <code>.remove(i)</code>. Python: <code>.append()</code>, indexing with <code>[i]</code>, and <code>.remove(value)</code> — by value, not index (<code>del list[i]</code> removes by index).",
    "Java: <code>Collections.unmodifiableList()</code> gives an immutable view of a list. Python: tuple is immutable by construction — <code>(1, 2, 3)</code>, a genuinely different type, not a wrapped list.",

    note: "The list methods you'll reach for constantly.",

nums.sort()                    # in-place sort
sorted_copy = sorted(nums)      # new sorted list, original untouched`,

  examples: [
    {
      title: "Tuples for multiple returns and unpacking",
      prompt: "Return more than one value from a function without a wrapper class.",
      code: `def min_max(nums):
    return min(nums), max(nums)   # packs into a tuple automatically

lo, hi = min_max([3, 1, 4, 1, 5])   # unpacked directly into two variables
print(lo, hi)`,
      explanation: "In Java, this would require a small record/wrapper class (or returning an int[]) just to carry two values out of a method. Python's tuple makes 'return several values' a zero-ceremony, first-class pattern — the function packs them, the caller unpacks them by position.",
      output: "1 5",
    },
    {
      title: "Slicing, and the shared-reference gotcha",
      prompt: "List slicing beyond substrings, plus a classic bug when multiplying a list of mutable elements.",
      code: `nums = [1, 2, 3, 4, 5]
print(nums[1:3])      # [2, 3]
print(nums[:2])         # [1, 2]
print(nums[::2])         # [1, 3, 5] -- every other element

# the classic gotcha: multiplying a list of lists shares ONE inner list
grid = [[0] * 3] * 3       # WRONG -- all 3 rows are the same object
grid[0][0] = 1
print(grid)                    # [[1,0,0], [1,0,0], [1,0,0]] -- every row changed!

grid = [[0] * 3 for _ in range(3)]   # correct -- a fresh list each iteration`,
      explanation: "<code>[[0]*3] * 3</code> creates one inner list, then repeats the <em>reference</em> to it three times — the same b = a mutability trap from the syntax page. Mutating one row mutates all of them since they're literally the same object. The list comprehension version calls <code>[0]*3</code> fresh on every iteration, producing three independent lists.",

    },
  ],
