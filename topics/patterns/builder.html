const PAGE_DATA = {
  summary: "Builder constructs a complex object step by step, so callers don't need giant constructors or telescoping overloads. Requests, queries, reports, and configuration objects with many optional parts are typical candidates.",
  keyHeading: "When to use it, and the Pythonic take",
  keyPoints: [
    "Use when an object has many optional parts, or must be validated before it's considered complete.",
    "Java: nested Builder class, fluent setters, <code>build()</code>. Python: <strong>keyword arguments with defaults</strong> cover most cases already.",
    "A frozen <code>@dataclass</code> plus <code>dataclasses.replace()</code> gives immutable 'builder-like' updates.",
    "Use a real builder when construction is multi-step, order-dependent, or needs validation at <code>build()</code> time (for example, assembling an HTTP request or SQL query).",
  ],
  template: {
    heading: "First try: keyword arguments and a dataclass",
    label: "python",
    note: "Before writing a Builder class, check whether this is enough.",
    code: `from dataclasses import dataclass, replace

@dataclass(frozen=True)
class Request:
    url: str
    method: str = "GET"
    timeout: float = 10.0
    retries: int = 3

base = Request("https://api.example.com/items")
slow = replace(base, timeout=60.0, retries=5)   # new object, base untouched
print(base.timeout, slow.timeout)`,
  },
  examples: [
    {
      title: "Fluent builder with validation",
      prompt: "Assemble a query step by step and validate it when <code>build()</code> is called.",
      code: `class QueryBuilder:
    def __init__(self, table):
        self._table = table
        self._where = []
        self._limit = None

    def where(self, cond):
        self._where.append(cond)
        return self                      # return self so calls chain

    def limit(self, n):
        self._limit = n
        return self

    def build(self):
        if self._limit is not None and self._limit <= 0:
            raise ValueError("limit must be positive")
        sql = f"SELECT * FROM {self._table}"
        if self._where:
            sql += " WHERE " + " AND ".join(self._where)
        if self._limit is not None:
            sql += f" LIMIT {self._limit}"
        return sql

q = QueryBuilder("orders").where("status = 'open'").where("total > 100").limit(10).build()
print(q)`,
      explanation: "Each method mutates the builder and returns <code>self</code>, enabling chaining. <code>build()</code> is the single place to validate and produce the final value. (Note: this demo interpolates raw strings. Real code must use parameterized queries to avoid SQL injection.)",
      output: "SELECT * FROM orders WHERE status = 'open' AND total > 100 LIMIT 10",
    },
    {
      title: "Building an immutable result",
      prompt: "Keep the builder mutable but have <code>build()</code> return a frozen object so the product can't be changed afterwards.",
      code: `from dataclasses import dataclass

@dataclass(frozen=True)
class Report:
    title: str
    sections: tuple

class ReportBuilder:
    def __init__(self, title):
        self.title = title
        self.sections = []

    def add(self, text):
        self.sections.append(text)
        return self

    def build(self):
        return Report(self.title, tuple(self.sections))   # tuple: immutable snapshot

r = ReportBuilder("Q3").add("Intro").add("Numbers").build()
print(r)`,
      explanation: "Converting the list to a tuple at <code>build()</code> means later changes to the builder can't corrupt an already-built report.",
      output: "Report(title='Q3', sections=('Intro', 'Numbers'))",
    },
  ],
  gotchas: [
    "Using a builder where keyword arguments would do. Extra classes with no extra value are noise.",
    "Reusing one builder for two products: state from the first leaks into the second. Create a new builder or reset.",
    "String-built SQL is injection-prone. Builders that emit SQL should produce parameterized queries.",
  ],
  gotchasHeading: "Common pitfalls",
  practiceExercises: [
    "Change <code>QueryBuilder</code> to return <code>(sql, params)</code> with placeholders instead of interpolated values.",
    "Add an <code>order_by()</code> step and validate that the column is in an allow-list.",

        "Only for immutable objects",
        "Never",
      ],
      correct: 0,
      explanation: "Keyword arguments cover simple cases; builders help with staged construction and final validation.",
    },
    {
      question: "What makes a fluent interface chainable?",
      options: [
        "Each method returns self",
        "Each method returns None",
        "Methods are static",
        "Using global state",
      ],
      correct: 0,
      explanation: "Returning the builder from every step lets calls be chained.",
    },
    {
      question: "What does dataclasses.replace() give you?",
      options: [
        "A modified copy of a (possibly frozen) dataclass instance",
        "A mutated original",
        "A deep copy of the database",
        "A new class",
      ],
      correct: 0,
      explanation: "It creates a new instance with selected fields changed, leaving the original untouched.",
    },
    {
      question: "Why convert a list to a tuple in build()?",
      options: [
        "To make the built product an immutable snapshot, isolated from the builder",
        "Tuples are faster to print",
        "Lists can't be stored in dataclasses",
        "It is required by Python",
      ],
      correct: 0,
      explanation: "The product can't be changed later by mutating the builder's list.",
    },
    {
      question: "What is the risk of building SQL by string concatenation?",
      options: [
        "SQL injection",
        "Slower Python",
        "Syntax errors in Python",
        "Losing type hints",
      ],
      correct: 0,
      explanation: "Untrusted values inside SQL text can change the query. Use parameters.",
    },
  ],
  id: "builder",
};
