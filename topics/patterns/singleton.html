const PAGE_DATA = {
  summary: "Singleton guarantees a class has exactly one instance and gives global access to it. Typical uses: configuration, a connection pool, a logger. It is also the most overused pattern, because it is global state with a nicer name.",
  keyHeading: "When to use it, and the Pythonic take",
  keyPoints: [
    "Use when exactly one shared instance is genuinely required: app config, a shared client/pool, a registry.",
    "Java: private constructor + static <code>getInstance()</code> + thread-safety concerns. Python: the simplest singleton is a <strong>module-level object</strong>.",
    "A class-based singleton is possible via <code>__new__</code>, a decorator, or a metaclass. Reach for these only if you need lazy creation or subclassing.",
    "Singletons make testing hard (hidden shared state). Prefer passing the instance in (see Dependency Injection).",
  ],
  template: {
    heading: "Module-level singleton (preferred)",
    label: "python",
    note: "Create the object once at module level; every importer gets the same one.",
    code: `# config.py
class _Config:
    def __init__(self):
        self.settings = {"env": "dev"}

config = _Config()          # created once, when the module is first imported

# elsewhere:
#   from config import config
#   config.settings["env"]`,
  },
  examples: [
    {
      title: "Class-based Singleton with __new__",
      prompt: "When you need the class form (for example, lazy creation), override <code>__new__</code> to return the same instance each time.",
      code: `class Registry:
    _instance = None

    def __new__(cls):
        if cls._instance is None:
            cls._instance = super().__new__(cls)
            cls._instance.items = {}
        return cls._instance

a = Registry()
b = Registry()
a.items["x"] = 1
print(a is b)          # True -- same object
print(b.items)         # {'x': 1}`,
      explanation: "<code>__new__</code> runs before <code>__init__</code> and controls object creation. Returning the cached instance means every <code>Registry()</code> call yields the same object. Note that <code>__init__</code> would run again on each call, which is why the state is set inside <code>__new__</code> here.",
      output: "True / {'x': 1}",
    },
    {
      title: "Thread-safe lazy singleton",
      prompt: "Two threads calling the constructor at the same moment could each create an instance. Guard creation with a lock.",
      code: `import threading

class Client:
    _instance = None
    _lock = threading.Lock()

    def __new__(cls):
        if cls._instance is None:               # fast path, no lock
            with cls._lock:
                if cls._instance is None:        # re-check inside the lock
                    cls._instance = super().__new__(cls)
        return cls._instance

print(Client() is Client())`,
      explanation: "This is double-checked locking: the cheap check avoids taking the lock on every call, and the second check inside the lock prevents two threads that both passed the first check from each creating an instance.",
      output: "True",
    },
  ],
  gotchas: [
    "Hidden global state: tests that mutate a singleton leak into other tests. Provide a way to reset it, or inject it instead.",
    "With the <code>__new__</code> form, <code>__init__</code> re-runs on every <code>Registry()</code> call and can wipe state. Initialize in <code>__new__</code> or guard <code>__init__</code>.",
    "Multiprocessing: each process gets its own copy, so 'one instance' means one per process, not one per machine.",

        "To make the code slower on purpose",
        "Because __new__ runs twice",
      ],
      correct: 0,
      explanation: "Double-checked locking keeps the common path lock-free while still guaranteeing a single creation.",
    },

      ],
      correct: 0,
      explanation: "Shared mutable state couples code that shouldn't be coupled, and tests can affect each other.",
