const PAGE_DATA = {
  summary: "State lets an object change its behavior when its internal state changes, replacing sprawling if/elif checks on a status field with explicit states and legal transitions. Orders, tickets, jobs, and connection lifecycles are classic examples.",
  keyHeading: "When to use it, and the Pythonic take",
  keyPoints: [
    "Use when the same action means different things depending on status, or when only some transitions are legal (you can't ship a cancelled order).",
    "Java: State interface + one class per state. Python: for small machines, an <strong>Enum plus a transitions dict</strong> is clearer than classes.",
    "Use state <em>classes</em> when each state carries substantial behavior of its own.",
    "Making illegal transitions raise errors protects data integrity, which matters when your code syncs status between systems.",
  ],
  template: {
    heading: "Enum + transition table",
    label: "python",
    note: "Legal moves live in one data structure, not scattered across if statements.",
    code: `from enum import Enum

class Status(Enum):
    NEW = "new"
    PAID = "paid"
    SHIPPED = "shipped"
    CANCELLED = "cancelled"

ALLOWED = {
    Status.NEW:       {Status.PAID, Status.CANCELLED},
    Status.PAID:      {Status.SHIPPED, Status.CANCELLED},
    Status.SHIPPED:   set(),
    Status.CANCELLED: set(),
}

class Order:
    def __init__(self):
        self.status = Status.NEW
    def move_to(self, new):
        if new not in ALLOWED[self.status]:
            raise ValueError(f"{self.status.value} -> {new.value} not allowed")
        self.status = new`,
  },
  examples: [
    {
      title: "Using the state machine",
      prompt: "Legal transitions succeed; illegal ones fail loudly.",
      code: `from enum import Enum

class Status(Enum):
    NEW = "new"; PAID = "paid"; SHIPPED = "shipped"; CANCELLED = "cancelled"

ALLOWED = {
    Status.NEW: {Status.PAID, Status.CANCELLED},
    Status.PAID: {Status.SHIPPED, Status.CANCELLED},
    Status.SHIPPED: set(), Status.CANCELLED: set(),
}

class Order:
    def __init__(self): self.status = Status.NEW
    def move_to(self, new):
        if new not in ALLOWED[self.status]:
            raise ValueError(f"{self.status.value} -> {new.value} not allowed")
        self.status = new

o = Order()
o.move_to(Status.PAID)
o.move_to(Status.SHIPPED)
try:
    o.move_to(Status.CANCELLED)
except ValueError as e:
    print(e)`,
      explanation: "A shipped order can't be cancelled, and that rule is one line of data. When a customer's system sends an out-of-order status update, you get an explicit error instead of silent corruption.",
      output: "shipped -> cancelled not allowed",
    },
    {
      title: "State classes with behavior",
      prompt: "When states have different behavior, not just different permissions, give each its own class.",
      code: `class Idle:
    def press(self, player):
        player.state = Playing()
        return "start playing"

class Playing:
    def press(self, player):
        player.state = Paused()
        return "pause"

class Paused:
    def press(self, player):
        player.state = Playing()
        return "resume"

class Player:
    def __init__(self):
        self.state = Idle()
    def press(self):
        return self.state.press(self)      # behavior delegates to the current state

p = Player()
print([p.press() for _ in range(4)])`,
      explanation: "The same <code>press()</code> call does different things depending on the current state object. No conditionals: each state decides what happens and which state comes next.",
      output: "['start playing', 'pause', 'resume', 'pause']",
    },
  ],
  gotchas: [
    "Allowing direct assignment to <code>status</code> from anywhere bypasses the rules. Route changes through one method.",
