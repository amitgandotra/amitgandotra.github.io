const PAGE_DATA = {
  summary: "A proxy stands in for another object and controls access to it: lazy loading an expensive resource, caching results, checking permissions, or rate limiting. Callers use the proxy exactly like the real object.",
  keyHeading: "When to use it, and the Pythonic take",
  keyPoints: [
    "<strong>Virtual proxy</strong>: delay creating something expensive until first use.",
    "<strong>Protection proxy</strong>: check permissions before delegating.",
    "<strong>Caching / rate-limiting proxy</strong>: reduce calls to a slow or metered API.",
    "Structurally similar to Decorator; the intent differs. Decorator adds features, Proxy controls access to the same object.",
    "Python extras: <code>functools.cached_property</code> for lazy attributes, <code>__getattr__</code> for transparent delegation.",
  ],
  template: {
    heading: "Lazy (virtual) proxy",
    label: "python",
    note: "The expensive object is only built on first real use.",
    code: `class ExpensiveModel:
    def __init__(self):
        print("loading model...")     # imagine 30 seconds here
    def predict(self, x):
        return x * 2

class LazyModel:
    def __init__(self):
        self._real = None
    def predict(self, x):
        if self._real is None:
            self._real = ExpensiveModel()
        return self._real.predict(x)

m = LazyModel()          # instant: nothing loaded yet
print(m.predict(21))     # loads now, then predicts`,
  },
  examples: [
    {
      title: "Protection proxy",
      prompt: "Only admins may call destructive methods; everything else passes through.",
      code: `class Database:
    def read(self, key):   return f"value:{key}"
    def delete(self, key): return f"deleted:{key}"

class GuardedDatabase:
    def __init__(self, db, role):
        self._db, self._role = db, role
    def read(self, key):
        return self._db.read(key)
    def delete(self, key):
        if self._role != "admin":
            raise PermissionError("admin only")
        return self._db.delete(key)

viewer = GuardedDatabase(Database(), "viewer")
print(viewer.read("a"))
try:
    viewer.delete("a")
except PermissionError as e:
    print("blocked:", e)`,
      explanation: "The caller holds what looks like a Database. The proxy enforces policy in one place instead of every call site trusting itself.",
      output: "value:a / blocked: admin only",
    },
    {
      title: "Lazy attribute with cached_property",
      prompt: "Python has built-in lazy evaluation for attributes.",
      code: `from functools import cached_property

class Customer:
    def __init__(self, cid):
        self.cid = cid

    @cached_property
    def history(self):
        print("querying history...")
        return [f"order-{self.cid}-1", f"order-{self.cid}-2"]

c = Customer(9)
print(c.history)    # runs the query
print(c.history)    # cached: no second query`,
      explanation: "The first access computes and stores the value on the instance; later accesses read it directly. For many 'lazy load' needs this is simpler than writing a proxy class.",
      output: "querying history... / [...] / [...]",
    },
  ],
  gotchas: [
    "Caching proxies serve stale data. Decide on expiry or invalidation.",
    "A proxy that swallows or reshapes errors makes debugging hard. Preserve exceptions.",
    "Lazy creation and threads: two threads may both create the object. Guard with a lock if that matters.",
  ],
  gotchasHeading: "Common pitfalls",

    "Add a TTL to a caching proxy so entries expire after 60 seconds.",
    "Make the lazy proxy thread-safe with a lock.",

        "They're unrelated",
        "Proxy only works on functions",
        "Decorator only works on classes",
      ],
      correct: 0,
      explanation: "The structure is similar, but the goals differ.",
    },
    {
      question: "What does functools.cached_property provide?",

      correct: 0,
