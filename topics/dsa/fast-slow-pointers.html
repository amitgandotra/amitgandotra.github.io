    slow = fast = head
    while fast and fast.next:
        slow = slow.next
        fast = fast.next.next
        if slow is fast:                 # phase 1: they meet inside the cycle
            break
    else:
        return None

    slow = head                          # phase 2: restart one pointer at the head
    while slow is not fast:
        slow = slow.next
        fast = fast.next
    return slow                          # they meet at the cycle start`,
      explanation: "Phase 1 detects the cycle. Phase 2 works because the distance from the head to the cycle start equals the distance from the meeting point to the cycle start, going around. Advance both one step at a time and they meet exactly there.",

      complexityWhy: "Fast catches slow within at most one lap of the cycle once both are inside it, and the second phase walks at most n steps. Only two pointers are kept.",

      code: `def remove_nth_from_end(head, n):
    dummy = ListNode(0, head)            # handles removing the head itself
    lead = trail = dummy
    for _ in range(n):
        lead = lead.next                 # open a gap of n nodes
    while lead.next:
        lead = lead.next
        trail = trail.next
    trail.next = trail.next.next         # trail sits just before the target
    return dummy.next`,
