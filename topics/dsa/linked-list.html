const PAGE_DATA = {
  id: "linked-list",
  summary: "Pointer manipulation without random access. The core moves are: use a dummy head to simplify edge cases, reverse links iteratively, and use fast/slow pointers for cycle and midpoint problems.",
  recognize: [
    "Problem gives a ListNode with .val and .next",
    "Need to reverse, merge, detect a cycle, or find the middle of a list",
    "In-place modification with O(1) extra space is required",
    "Operations at the head are awkward &rarr; a dummy node usually simplifies them",
  ],
  template: {
    note: "Iterative reversal — the move every linked list problem eventually leans on.",
    code: `def reverse_list(head):
    prev = None
    curr = head
    while curr:
        next_node = curr.next
        curr.next = prev
        prev = curr
        curr = next_node
    return prev`,
  },
  examples: [
    {
      title: "Merge Two Sorted Lists",
      prompt: "Merge two sorted linked lists and return it as a new sorted list, splicing the existing nodes together.",
      code: `def merge_two_lists(l1, l2):
    dummy = ListNode()
    tail = dummy
    while l1 and l2:
        if l1.val <= l2.val:
            tail.next = l1
            l1 = l1.next
        else:
            tail.next = l2
            l2 = l2.next
        tail = tail.next
    tail.next = l1 or l2
    return dummy.next`,
      explanation: "The dummy node avoids special-casing which list starts smaller. Walk both lists, always attaching the smaller head to the tail, then attach whichever list has leftover nodes.",
      complexity: "Time: O(n + m) · Space: O(1) extra, excluding output",
      complexityWhy: "Each node from both lists is visited and relinked exactly once as the two pointers advance, so total work is proportional to the combined length of both lists, n + m. No new nodes are allocated — existing nodes are simply re-pointed, so extra space beyond the output pointers is O(1).",
    },
    {
      title: "Linked List Cycle II — find the start of the cycle",
      prompt: "Given the head of a linked list, return the node where the cycle begins, or None if there is no cycle.",
      code: `def detect_cycle(head):
    slow = fast = head
    while fast and fast.next:
        slow = slow.next
        fast = fast.next.next
        if slow == fast:
            break
    else:
        return None

    slow = head
    while slow != fast:
        slow = slow.next
        fast = fast.next
    return slow`,
      explanation: "Floyd's tortoise and hare first detects whether a cycle exists (slow meets fast). If it does, resetting one pointer to head and advancing both one step at a time makes them meet exactly at the cycle's start — a consequence of the distances involved.",
      complexity: "Time: O(n) · Space: O(1)",
      complexityWhy: "In the worst case the fast pointer takes at most n steps to either exit the list or catch up to the slow pointer inside a cycle, since the gap between them shrinks by one each step once both are inside the cycle. Only two pointer variables are used regardless of list length, so space is O(1).",
    },
  ],
  practiceProblems: [
    "Reverse Linked List",
    "Merge Two Sorted Lists",
    "Linked List Cycle",
    "Reorder List",
    "Remove Nth Node From End of List",
    "Copy List with Random Pointer",
  ],
  quiz: [
    {
      question: "Why use a dummy head node in linked list problems?",
      options: [
        "It avoids special-casing operations that would otherwise need to modify the head pointer itself",
        "It makes the list circular",
        "It's required by the language",
        "It automatically reverses the list",
      ],
      correct: 0,
      explanation: "With a dummy node, the real head is always dummy.next, so insertions/deletions near the front don't need special-case branches.",
    },
    {
      question: "Fast/slow pointers in a linked list are primarily used to...",
      options: [
        "Sort the list",
        "Detect cycles and find the middle node",
        "Reverse the list",
        "Merge two sorted lists",
      ],
      correct: 1,
      explanation: "Moving pointers at different speeds is exactly what lets you detect a cycle or land on the middle node in one pass.",
    },
    {
      question: "What's the space complexity of reversing a linked list iteratively in place?",
      options: ["O(n)", "O(log n)", "O(1)", "O(n^2)"],
      correct: 2,
      explanation: "You only ever need a constant number of pointer variables (prev, curr, next_node), regardless of list length.",
    },
    {
      question: "After detecting a cycle with fast/slow pointers, how do you find where the cycle begins?",
      options: [
        "Reset one pointer to head, then advance both one step at a time until they meet",
        "Restart only the fast pointer from head",
        "There's no way to find the start, only whether a cycle exists",
        "Use binary search on the list",
      ],
      correct: 0,
      explanation: "This is the second phase of Floyd's algorithm — the meeting point after resetting is provably the cycle's entry node.",
    },
    {
      question: "Merging two sorted linked lists with n and m nodes takes what time complexity?",
      options: ["O(n + m)", "O(n * m)", "O((n + m) log(n + m))", "O(1)"],
      correct: 0,
      explanation: "Each node from both lists is visited and relinked exactly once.",
    },
  ],
