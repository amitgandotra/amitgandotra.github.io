  summary: "Breadth-first search explores a graph in rings, using a queue, so the first time it reaches a node is along a path with the fewest edges. That makes it the tool for shortest paths in unweighted graphs, level-order traversal, 'minimum steps' puzzles, and spreading from several sources at once.",

    note: "Mark nodes when you <em>enqueue</em> them, not when you dequeue them.",
    code: `from collections import deque

def bfs_distance(graph, start, target):
    queue = deque([(start, 0)])
    seen = {start}
    while queue:
        node, dist = queue.popleft()
        if node == target:
            return dist
        for nxt in graph[node]:
            if nxt not in seen:
                seen.add(nxt)                 # mark on enqueue
                queue.append((nxt, dist + 1))
    return -1`,

      code: `from collections import deque

def oranges_rotting(grid):
    rows, cols = len(grid), len(grid[0])
    queue, fresh = deque(), 0
    for r in range(rows):
        for c in range(cols):
            if grid[r][c] == 2:
                queue.append((r, c))             # all rotten oranges start together
            elif grid[r][c] == 1:
                fresh += 1
    minutes = 0
    while queue and fresh:
        for _ in range(len(queue)):              # one BFS level == one minute
            r, c = queue.popleft()
            for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                nr, nc = r + dr, c + dc
                if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == 1:
                    grid[nr][nc] = 2
                    fresh -= 1
                    queue.append((nr, nc))
        minutes += 1
    return minutes if fresh == 0 else -1`,
      explanation: "Start the BFS from every rotten orange at once. Processing the queue one level at a time counts minutes. If fresh oranges remain when the queue empties, they were unreachable.",
      complexity: "Time: O(rows × cols) · Space: O(rows × cols)",

      code: `from collections import deque

def ladder_length(begin, end, word_list):
    words = set(word_list)
    if end not in words:
        return 0
    queue = deque([(begin, 1)])
    seen = {begin}
    while queue:
        word, steps = queue.popleft()
        if word == end:
            return steps
        for i in range(len(word)):
            for ch in "abcdefghijklmnopqrstuvwxyz":
                nxt = word[:i] + ch + word[i + 1:]
                if nxt in words and nxt not in seen:
                    seen.add(nxt)
                    queue.append((nxt, steps + 1))
    return 0`,
