  summary: "Union-Find (disjoint set union) tracks which elements belong to the same group. It merges two groups and answers 'are these two connected?' in near-constant time using path compression and union by size. It shines when connections arrive one at a time.",
  recognize: [
    "'Are X and Y connected / in the same group?', asked repeatedly",

  template: {
    note: "The standard DSU with path compression and union by size.",
    code: `class DSU:
    def __init__(self, n):
        self.parent = list(range(n))
        self.size = [1] * n
        self.components = n

    def find(self, x):
        while self.parent[x] != x:
            self.parent[x] = self.parent[self.parent[x]]    # path compression (halving)
            x = self.parent[x]
        return x

    def union(self, a, b):
        ra, rb = self.find(a), self.find(b)
        if ra == rb:
            return False                                     # already connected
        if self.size[ra] < self.size[rb]:
            ra, rb = rb, ra
        self.parent[rb] = ra                                 # attach the smaller tree
        self.size[ra] += self.size[rb]
        self.components -= 1
        return True`,

    for a, b in edges:
        if not dsu.union(a, b):        # a and b were already connected
            return [a, b]
    return []`,
