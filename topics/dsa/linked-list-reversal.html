    prev, curr = None, head
    while curr:
        nxt = curr.next          # 1. remember the rest
        curr.next = prev         # 2. flip the link
        prev, curr = curr, nxt   # 3. step forward

    dummy = ListNode(0, head)
    before = dummy
    for _ in range(left - 1):
        before = before.next                 # node just before the sublist
    prev, curr = None, before.next
    for _ in range(right - left + 1):
        nxt = curr.next
        curr.next = prev
        prev, curr = curr, nxt
    before.next.next = curr                  # old first node now points past the sublist
    before.next = prev                       # 'before' points to the new sublist head
    return dummy.next`,
      explanation: "Walk to the node before the sublist, reverse exactly <code>right - left + 1</code> nodes with the standard loop, then reconnect both ends. The dummy head handles the case where the sublist starts at the head.",

    while prev.next and prev.next.next:
        first, second = prev.next, prev.next.next
        first.next = second.next           # first now skips over second
