const PAGE_DATA = {
  id: "two-pointers",
  summary: "Two pointers move toward each other (or in the same direction at different speeds) across a sorted array or string. It collapses an O(n^2) brute-force pair search into a single O(n) sweep by exploiting order.",
  recognize: [
    "Array or string is sorted, or can cheaply be sorted, and you need pairs/triplets meeting a condition",
    "Need to compare from both ends inward (palindrome check, container problems)",
    "Need to remove/partition/compact elements in place without extra space",
    "Fast/slow pointer variant: cycle detection, finding the middle of a linked list",
  ],
  template: {
    note: "The classic converging form on a sorted array or string.",
    code: `def two_pointer_template(arr, target):
    left, right = 0, len(arr) - 1
    while left < right:
        curr = arr[left] + arr[right]
        if curr == target:
            return [left, right]
        elif curr < target:
            left += 1
        else:
            right -= 1
    return []`,
  },
  examples: [
    {
      title: "Valid Palindrome",
      prompt: "Given a string, determine if it's a palindrome, considering only alphanumeric characters and ignoring case.",
      code: `def is_palindrome(s):
    left, right = 0, len(s) - 1
    while left < right:
        while left < right and not s[left].isalnum():
            left += 1
        while left < right and not s[right].isalnum():
            right -= 1
        if s[left].lower() != s[right].lower():
            return False
        left += 1
        right -= 1
    return True`,
      explanation: "Pointers converge from the outside in, skipping non-alphanumeric characters and comparing case-insensitively, until they meet in the middle.",
      complexity: "Time: O(n) · Space: O(1)",
      complexityWhy: "left and right each move inward at most n/2 times combined, so the total number of character comparisons is bounded by n regardless of how many get skipped for being non-alphanumeric. No extra data structure grows with input size, so space stays constant.",
    },
    {
      title: "3Sum",
      prompt: "Given an array of integers, return all unique triplets that sum to zero.",
      code: `def three_sum(nums):
    nums.sort()
    res = []
    for i in range(len(nums)):
        if i > 0 and nums[i] == nums[i - 1]:
            continue
        left, right = i + 1, len(nums) - 1
        while left < right:
            total = nums[i] + nums[left] + nums[right]
            if total < 0:
                left += 1
            elif total > 0:
                right -= 1
            else:
                res.append([nums[i], nums[left], nums[right]])
                left += 1
                while left < right and nums[left] == nums[left - 1]:
                    left += 1
    return res`,
      explanation: "Sort first so the two-pointer sweep can decide direction from comparisons. Fix one element with an outer loop, then two-pointer the rest. Skip duplicates at both the outer loop and inner sweep to keep triplets unique.",
      complexity: "Time: O(n^2) · Space: O(1) excluding output",
      complexityWhy: "Sorting costs O(n log n), but the outer loop (n iterations) combined with an inner two-pointer sweep (up to n iterations each) dominates at O(n^2), since n^2 grows faster than n log n. No extra array is allocated for the search itself — only the output triplets use extra space.",
    },
  ],

        "Moving the taller line is faster to compute",
        "It guarantees the left pointer moves first",

      correct: 1,
      explanation: "Height is capped by the shorter side, so only moving the shorter pointer has a chance of finding a larger area.",
    },
    {
      question: "Converting a brute-force O(n^2) pair search into a two-pointer sweep over sorted data typically achieves what complexity (ignoring the sort itself)?",

      question: "The fast/slow pointer (tortoise and hare) technique is the standard approach for...",

        "Detecting a cycle in a linked list",

        "Finding the median of two sorted arrays",

      correct: 1,

    },
  ],
