      title: "Maximum Depth of Binary Tree",
      prompt: "Given the root of a binary tree, return its maximum depth.",
      code: `def max_depth(root):
    if not root:
        return 0
    return 1 + max(max_depth(root.left), max_depth(root.right))`,
      explanation: "Classic post-order recursion: the depth of a node is 1 plus the deeper of its two subtrees. A null node contributes 0, acting as the correct base case for the max() combination.",

      complexityWhy: "Every node in the tree is visited exactly once by the recursion, giving O(n) total calls. The space cost comes from the recursion call stack, which grows as deep as the tree is tall — O(h), which is O(log n) for a balanced tree but can degrade to O(n) for a skewed one.",

      title: "Binary Tree Level Order Traversal",
      prompt: "Given the root of a binary tree, return the level order traversal of its nodes' values, grouped by level.",
      code: `from collections import deque

def level_order(root):
    if not root:
        return []
    result = []
    queue = deque([root])
    while queue:
        level = []
        for _ in range(len(queue)):
            node = queue.popleft()
            level.append(node.val)
            if node.left:
                queue.append(node.left)
            if node.right:
                queue.append(node.right)
        result.append(level)
    return result`,
      explanation: "Snapshotting len(queue) at the top of each iteration captures exactly the nodes belonging to the current level, so children appended during the loop don't bleed into the current level's count.",
      complexity: "Time: O(n) · Space: O(n)",
      complexityWhy: "Every node is enqueued and dequeued exactly once, giving O(n) time. In the worst case (a wide tree, like a complete binary tree's last level) the queue can hold up to roughly n/2 nodes at once, which rounds to O(n) space.",
