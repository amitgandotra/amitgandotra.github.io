  id: "dfs",
  summary: "Depth-first search follows one branch as far as it goes before backing up. Use it to visit everything reachable, count connected components, detect cycles, copy a graph, or enumerate paths in trees and graphs. It runs in O(V + E) with recursion or an explicit stack.",
  recognize: [
    "'Explore all paths' or 'is B reachable from A'",

  template: {
    note: "Recursive DFS with a visited set, and the same thing with an explicit stack for very deep graphs.",
    code: `def dfs(graph, start):
    seen = set()
    def visit(node):
        seen.add(node)
        for nxt in graph[node]:
            if nxt not in seen:
                visit(nxt)
    visit(start)
    return seen

def dfs_iterative(graph, start):
    seen, stack = {start}, [start]
    while stack:
        node = stack.pop()
        for nxt in graph[node]:
            if nxt not in seen:
                seen.add(nxt)
                stack.append(nxt)
    return seen`,
  },
  examples: [
    {
      title: "Number of Provinces (connected components)",
      prompt: "Given an adjacency matrix where <code>is_connected[i][j] == 1</code> means cities i and j are directly connected, count the <strong>groups of connected cities</strong>.",
      code: `def find_circle_num(is_connected):
    n = len(is_connected)
    seen = set()

    def visit(i):
        seen.add(i)
        for j in range(n):
            if is_connected[i][j] and j not in seen:
                visit(j)

    provinces = 0
    for i in range(n):
        if i not in seen:
            provinces += 1               # a new, unvisited city starts a new group
            visit(i)                     # mark everything connected to it
    return provinces`,
      explanation: "The outer loop makes sure disconnected parts are all found. Each time it meets an unvisited city, that city begins a new component, and one DFS marks the whole component so it is never counted twice.",
      complexity: "Time: O(n²) · Space: O(n)",
      complexityWhy: "Each city is visited once, and visiting scans a full matrix row of length n, giving n × n work. The visited set and recursion stack are at most n deep.",
    },
    {
      title: "Course Schedule (cycle detection)",
      prompt: "Given <code>num_courses</code> and prerequisite pairs <code>[a, b]</code> ('to take a you must first take b'), decide whether all courses can be finished. That is, the graph has <strong>no cycle</strong>.",
      code: `def can_finish(num_courses, prerequisites):
    graph = {i: [] for i in range(num_courses)}
    for course, pre in prerequisites:
        graph[course].append(pre)

    state = {}                      # 0 = on the current path, 1 = fully explored

    def has_cycle(node):
        if state.get(node) == 0:
            return True             # back edge: we looped onto our own path
        if state.get(node) == 1:
            return False            # already proven safe
        state[node] = 0
        for pre in graph[node]:
            if has_cycle(pre):
                return True
        state[node] = 1
        return False

    return not any(has_cycle(c) for c in range(num_courses))`,
      explanation: "A plain visited set is not enough for directed graphs: reaching a visited node is fine if it was finished earlier, but reaching one that is <em>still on the current path</em> means a cycle. Three states (unvisited, on path, done) capture that.",
