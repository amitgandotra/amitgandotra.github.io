const PAGE_DATA = {
  id: "graphs",
  summary: "Model relationships as nodes and edges, then traverse with DFS (recursion/stack) or BFS (queue) depending on whether you need 'any path' or 'shortest path' in an unweighted graph. Adjacency lists are the default representation for sparse graphs.",
  recognize: [
    "Problem mentions connections, a network, or an explicit graph",
    "Need connected components, shortest path in an unweighted graph (&rarr; BFS), or cycle detection",
    "Grid problems (2D array where each cell connects to 4 neighbors) are graphs in disguise",
    "Need a valid ordering under dependencies &rarr; DAG + topological sort",
  ],
  template: {
    note: "BFS is the standard shortest-path traversal for unweighted graphs, since it explores nodes in strict order of distance from the source.",
    code: `from collections import deque

def bfs_shortest_path(graph, start, target):
    visited = {start}
    queue = deque([(start, 0)])
    while queue:
        node, dist = queue.popleft()
        if node == target:
            return dist
        for neighbor in graph[node]:
            if neighbor not in visited:
                visited.add(neighbor)
                queue.append((neighbor, dist + 1))
    return -1`,
  },
  examples: [
    {
      title: "Number of Islands",
      prompt: "Given an m x n grid of '1's (land) and '0's (water), count the number of islands, where an island is a group of connected '1's (horizontally/vertically adjacent).",
      code: `def num_islands(grid):
    if not grid:
        return 0
    rows, cols = len(grid), len(grid[0])
    visited = set()

    def dfs(r, c):
        if (r < 0 or r >= rows or c < 0 or c >= cols
                or grid[r][c] == "0" or (r, c) in visited):
            return
        visited.add((r, c))
        for dr, dc in [(1, 0), (-1, 0), (0, 1), (0, -1)]:
            dfs(r + dr, c + dc)

    islands = 0
    for r in range(rows):
        for c in range(cols):
            if grid[r][c] == "1" and (r, c) not in visited:
                dfs(r, c)
                islands += 1
    return islands`,
      explanation: "The grid is an implicit graph where each land cell connects to its 4 orthogonal neighbors. Scanning for an unvisited land cell and flood-filling with DFS marks a whole island at once; each flood-fill increments the island count by exactly one.",
      complexity: "Time: O(rows * cols) · Space: O(rows * cols) for visited + recursion stack",
      complexityWhy: "Every cell is visited by the outer scan once, and every land cell triggers at most one DFS visit (since visited cells are skipped), so total work across the whole grid is proportional to its size, rows * cols. The visited set and, in the worst case, the recursion stack for an all-land grid can both grow to hold every cell, giving O(rows * cols) space.",
    },
    {
      title: "Course Schedule (cycle detection)",
      prompt: "Given numCourses and prerequisite pairs [a, b] meaning 'to take a you must first take b', determine whether it's possible to finish all courses.",
      code: `def can_finish(num_courses, prerequisites):
    graph = {i: [] for i in range(num_courses)}
    for course, pre in prerequisites:
        graph[course].append(pre)

    state = {}  # 0 = visiting, 1 = done

    def has_cycle(node):
        if state.get(node) == 0:
            return True   # back edge -> cycle
        if state.get(node) == 1:
            return False  # already fully processed

        state[node] = 0
        for pre in graph[node]:
            if has_cycle(pre):
                return True
        state[node] = 1
        return False

    return not any(has_cycle(course) for course in range(num_courses))`,
      explanation: "This is cycle detection via DFS with three-state marking. A node currently 'in progress' (state 0) being revisited means the traversal looped back on itself — a cycle, which means the courses can't all be scheduled.",
      complexity: "Time: O(V + E) · Space: O(V)",
      complexityWhy: "Each course (vertex) is visited once and each prerequisite (edge) is examined once during the DFS, giving O(V + E) total. The state map and recursion stack both scale with the number of courses, giving O(V) space.",
    },
  ],
  practiceProblems: [
    "Number of Islands",
    "Clone Graph",
    "Course Schedule",
    "Pacific Atlantic Water Flow",
    "Graph Valid Tree",
    "Number of Connected Components in an Undirected Graph",
  ],
  quiz: [
    {
      question: "For finding the shortest path in an unweighted graph, which traversal do you use?",
      options: [
        "BFS, since it explores in order of distance from the source",
        "DFS, since it goes deep first",
        "Binary search",
        "Backtracking",
      ],
      correct: 0,
      explanation: "BFS visits nodes in increasing distance order, so the first time you reach a target node, you've found the shortest path to it.",
    },
    {
      question: "A 2D grid problem where each cell connects to its neighbors is best modeled as...",
      options: ["An implicit graph, traversed with DFS/BFS", "A trie", "A heap", "A linked list"],
      correct: 0,
      explanation: "Grid cells are nodes and adjacency is the edge relation — the same traversal tools apply directly.",
    },
    {
      question: "In Number of Islands, why does the DFS mark cells as visited before recursing further?",
      options: [
        "To avoid revisiting the same cell repeatedly, which would loop forever or overcount islands",
        "It's optional and has no functional purpose",
        "To sort the grid",
        "To detect a cycle only",
      ],
      correct: 0,
      explanation: "Without tracking visited cells, the flood-fill would recurse infinitely (or at least redundantly) across already-explored land.",
    },
    {
      question: "In Course Schedule's cycle detection, what does a node in 'visiting' state being revisited indicate?",
      options: [
        "A cycle exists, so the courses can't all be scheduled",
        "The graph is disconnected",
        "The course has no prerequisites",
        "An error in the input format",
      ],
      correct: 0,
      explanation: "Reaching a node that's still 'in progress' on the current DFS path is exactly the signature of a back edge, i.e. a cycle.",
    },
    {
      question: "What's the time complexity of a standard graph DFS/BFS traversal with V vertices and E edges (adjacency list)?",
      options: ["O(V + E)", "O(V * E)", "O(V^2)", "O(E log E)"],
      correct: 0,
      explanation: "Each vertex is visited once and each edge is examined once (or twice for undirected graphs), giving linear time in the graph's size.",
    },
  ],
};
</script>
