const PAGE_DATA = {
  id: "dp-1d",
  summary: "Break a problem into overlapping subproblems indexed by a single variable (position, amount, or length), and cache results to avoid recomputation. Recognize it by noticing brute-force recursion would re-solve the same subproblem over and over.",
  recognize: [
    "Optimal substructure: the answer at position i depends on answers at smaller positions",
    "Brute-force recursion would re-solve identical subproblems (overlapping subproblems)",
    "Keywords: 'number of ways', 'minimum/maximum cost to reach', 'can you reach...'",
    "State can be described by a single index: day, amount, or position in a string",
  ],
  template: {
    note: "Top-down memoization. Bottom-up (tabulation) does the same thing iteratively, and often gets O(1) space if only the last few states matter.",
    code: `def fib_memo(n, memo={}):
    if n <= 1:
        return n
    if n in memo:
        return memo[n]
    memo[n] = fib_memo(n - 1, memo) + fib_memo(n - 2, memo)
    return memo[n]`,
  },
  examples: [
    {
      title: "House Robber",
      prompt: "Given nums representing money in houses arranged in a row, you cannot rob two adjacent houses. Return the maximum money you can rob.",
      code: `def rob(nums):
    prev, curr = 0, 0
    for n in nums:
        prev, curr = curr, max(curr, prev + n)
    return curr`,
      explanation: "curr represents the best result including house i; prev is the best result up through house i-1. At each house you either skip it (keep curr) or rob it (prev + n). Rolling two variables instead of a full array gives O(1) space.",
      complexity: "Time: O(n) · Space: O(1)",
      complexityWhy: "The array is scanned once, with O(1) work updating the two rolling variables per house, giving O(n) time. Because only the previous two states are ever needed, no array proportional to n is allocated, giving O(1) space.",
    },
    {
      title: "Coin Change",
      prompt: "Given coin denominations and a target amount, return the fewest number of coins needed to make that amount, or -1 if it can't be made.",
      code: `def coin_change(coins, amount):
    dp = [0] + [float("inf")] * amount
    for a in range(1, amount + 1):
        for c in coins:
            if c <= a:
                dp[a] = min(dp[a], dp[a - c] + 1)
    return dp[amount] if dp[amount] != float("inf") else -1`,
      explanation: "dp[a] holds the minimum coins to make amount a. For each amount, try every coin as 'the last coin used' and build on the best result for the smaller amount already solved.",
      complexity: "Time: O(amount * len(coins)) · Space: O(amount)",
      complexityWhy: "For each of the `amount` possible sub-amounts, the algorithm tries every one of the `len(coins)` denominations, giving amount * len(coins) total operations. The dp array holds one entry per possible amount from 0 to amount, giving O(amount) space.",
    },
  ],
  practiceProblems: [
    "Climbing Stairs",
    "House Robber",
    "Coin Change",
    "Longest Increasing Subsequence",
    "Word Break",
    "Decode Ways",
  ],

    {
      question: "1-D DP problems are recognized by state that can be described with...",

      explanation: "That's the defining feature separating 1-D DP from 2-D DP, where two indices are needed.",

    {
      question: "What's the core inefficiency that DP eliminates versus naive recursion?",

      correct: 0,

        "Whether amount a is reachable, true/false",
      ],
      correct: 0,
      explanation: "Each dp[a] is built by taking the best (minimum) result from dp[a - coin] + 1 across all valid coins.",

      question: "Top-down (memoization) and bottom-up (tabulation) DP differ mainly in...",
