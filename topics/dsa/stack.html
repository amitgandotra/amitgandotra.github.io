    note: "The bracket matcher: push openers, and each closer must match the most recent opener.",
    code: `def is_balanced(s):
    pairs = {")": "(", "]": "[", "}": "{"}
    stack = []
    for ch in s:
        if ch in pairs:
            if not stack or stack.pop() != pairs[ch]:
                return False
        else:
            stack.append(ch)
    return not stack`,

      title: "Min Stack",
      prompt: "Design a stack that supports <code>push</code>, <code>pop</code>, <code>top</code> and <code>get_min</code>, each in <strong>O(1)</strong>.",
      code: `class MinStack:
    def __init__(self):
        self.stack = []                      # (value, minimum so far)

    def push(self, x):
        current_min = min(x, self.stack[-1][1]) if self.stack else x
        self.stack.append((x, current_min))

    def pop(self):
        self.stack.pop()

    def top(self):
        return self.stack[-1][0]

    def get_min(self):
        return self.stack[-1][1]`,
      explanation: "Store the running minimum beside every value. When you pop, the previous minimum is already sitting underneath, so no search is ever needed.",
      complexity: "Time: O(1) per operation · Space: O(n)",
      complexityWhy: "Every operation touches only the top of the list. Each stored entry adds a constant amount of extra data (the running minimum).",
    },
    {
      title: "Evaluate Reverse Polish Notation",
      prompt: "Evaluate an expression in <strong>postfix</strong> notation, such as <code>[\"2\", \"1\", \"+\", \"3\", \"*\"]</code> (which is (2 + 1) * 3).",
      code: `def eval_rpn(tokens):
    stack = []
    for t in tokens:
        if t in ("+", "-", "*", "/"):
            b, a = stack.pop(), stack.pop()      # right operand comes off first
            if t == "+":
                stack.append(a + b)
            elif t == "-":
                stack.append(a - b)
            elif t == "*":
                stack.append(a * b)
            else:
                stack.append(int(a / b))          # truncate toward zero, like Java
        else:
            stack.append(int(t))
    return stack[0]`,
      explanation: "Push numbers. An operator consumes the two most recent numbers and pushes the result, so nested sub-expressions resolve themselves. Note that <code>a // b</code> would floor for negatives, so use <code>int(a / b)</code> to truncate toward zero.",
      complexity: "Time: O(n) · Space: O(n)",
