const PAGE_DATA = {
  id: "stack",
  summary: "A stack is a LIFO structure for matching and nesting problems — parentheses validation, monotonic sequences, expression evaluation. Whenever you need to remember the most recent unmatched thing, reach for a stack.",
  recognize: [
    "Matching pairs: parentheses, brackets, tags",
    "'Next greater/smaller element' style problems &rarr; monotonic stack",
    "Need to undo or backtrack the most recent operation",
    "Evaluating expressions: postfix notation, calculator-style problems",
  ],
  template: {
    note: "The monotonic stack template — keeps values decreasing bottom to top, popping whenever the pattern breaks.",
    code: `def next_greater_elements(nums):
    result = [-1] * len(nums)
    stack = []  # indices, values decreasing bottom to top
    for i, n in enumerate(nums):
        while stack and nums[stack[-1]] < n:
            result[stack.pop()] = n
        stack.append(i)
    return result`,
  },
  examples: [
    {
      title: "Valid Parentheses",
      prompt: "Given a string containing just '(', ')', '{', '}', '[' and ']', determine if the input string is valid.",
      code: `def is_valid(s):
    pairs = {')': '(', ']': '[', '}': '{'}
    stack = []
    for ch in s:
        if ch in pairs:
            if not stack or stack.pop() != pairs[ch]:
                return False
        else:
            stack.append(ch)
    return not stack`,
      explanation: "Push opening brackets. On a closing bracket, pop and check it matches the corresponding opener. If the stack is empty when a closer arrives, or openers are left over at the end, the string is invalid.",
      complexity: "Time: O(n) · Space: O(n)",
      complexityWhy: "Each character is examined exactly once, and every stack push/pop is O(1), giving O(n) total time. In the worst case (e.g. a string of all opening brackets) every character sits on the stack simultaneously, which is the O(n) space bound.",
    },
    {
      title: "Daily Temperatures",
      prompt: "Given daily temperatures, return a list where answer[i] is the number of days until a warmer temperature (0 if none).",
      code: `def daily_temperatures(temps):
    result = [0] * len(temps)
    stack = []  # indices with decreasing temps
    for i, t in enumerate(temps):
        while stack and temps[stack[-1]] < t:
            j = stack.pop()
            result[j] = i - j
        stack.append(i)
    return result`,
      explanation: "Maintain a monotonic decreasing stack of indices. When the current temperature beats the top of the stack, that day just found its warmer day — pop it and record the distance.",
      complexity: "Time: O(n), each index pushed and popped once · Space: O(n)",
      complexityWhy: "Although there's a nested while loop, each index is pushed onto the stack exactly once and popped at most once across the entire run — that amortized accounting is what keeps total work at O(n) rather than O(n^2). The stack can hold up to n indices in the worst case (strictly decreasing temperatures), giving O(n) space.",
    },

  practiceProblems: [
