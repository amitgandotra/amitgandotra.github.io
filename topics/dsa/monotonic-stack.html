    note: "Keep values decreasing from bottom to top. Anything smaller than the current value has just found its next greater element.",
    code: `def next_greater(nums):
    result = [-1] * len(nums)
    stack = []                             # indices whose values are decreasing
    for i, x in enumerate(nums):
        while stack and nums[stack[-1]] < x:
            result[stack.pop()] = x        # x is the next greater for that index
        stack.append(i)
    return result`,

      title: "Daily Temperatures",

    result = [0] * len(temps)
    stack = []                             # indices with decreasing temperatures
    for i, t in enumerate(temps):
        while stack and temps[stack[-1]] < t:
            j = stack.pop()
            result[j] = i - j
        stack.append(i)
    return result`,
      explanation: "Store <em>indices</em>, not values, so you can compute the distance. When today is warmer than the day on top of the stack, that day just found its answer: pop it and record the gap.",
      complexity: "Time: O(n) · Space: O(n)",
      complexityWhy: "Each index is pushed once and popped at most once across the whole run. That amortised accounting keeps the nested while loop linear.",
    },

      title: "Largest Rectangle in Histogram",
      prompt: "Given bar heights, return the <strong>area of the largest rectangle</strong> that fits inside the histogram.",
      code: `def largest_rectangle_area(heights):
    stack = []                                   # indices, heights increasing
    best = 0
    for i, h in enumerate(heights + [0]):        # a final 0 flushes the stack
        while stack and heights[stack[-1]] >= h:
            height = heights[stack.pop()]
            left = stack[-1] if stack else -1    # nearest smaller bar on the left
            best = max(best, height * (i - left - 1))
        stack.append(i)
    return best`,
