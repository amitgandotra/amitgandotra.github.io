    note: "Dijkstra with a min-heap. Skip stale heap entries whose distance is already worse.",
    code: `import heapq

def dijkstra(graph, start):
    dist = {start: 0}
    heap = [(0, start)]
    while heap:
        d, node = heapq.heappop(heap)
        if d > dist.get(node, float("inf")):
            continue                        # stale entry: a shorter path was found already
        for neighbor, weight in graph[node]:
            nd = d + weight
            if nd < dist.get(neighbor, float("inf")):
                dist[neighbor] = nd
                heapq.heappush(heap, (nd, neighbor))
    return dist`,

from collections import defaultdict

def network_delay_time(times, n, k):
    graph = defaultdict(list)
    for u, v, w in times:
        graph[u].append((v, w))

    dist = {}
    heap = [(0, k)]
    while heap:
        d, node = heapq.heappop(heap)
        if node in dist:
            continue
        dist[node] = d                       # the first time a node is popped is its shortest distance
        for neighbor, w in graph[node]:
            if neighbor not in dist:
                heapq.heappush(heap, (d + w, neighbor))

    return max(dist.values()) if len(dist) == n else -1`,
      explanation: "Pop the closest unvisited node, lock in its distance, and push its neighbours with updated distances. The signal reaches everyone when the <em>farthest</em> node is reached, so the answer is the maximum of the shortest distances.",

def minimum_effort_path(heights):
    rows, cols = len(heights), len(heights[0])
    best = [[float("inf")] * cols for _ in range(rows)]
    best[0][0] = 0
    heap = [(0, 0, 0)]                            # (effort so far, row, col)
    while heap:
        effort, r, c = heapq.heappop(heap)
        if (r, c) == (rows - 1, cols - 1):
            return effort
        if effort > best[r][c]:
            continue
        for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
            nr, nc = r + dr, c + dc
            if 0 <= nr < rows and 0 <= nc < cols:
                step = abs(heights[nr][nc] - heights[r][c])
                nxt = max(effort, step)           # path cost = the worst step, not the sum
                if nxt < best[nr][nc]:
                    best[nr][nc] = nxt
                    heapq.heappush(heap, (nxt, nr, nc))
    return 0`,
