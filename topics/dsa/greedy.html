const PAGE_DATA = {
  id: "greedy",
  summary: "Make the locally optimal choice at each step and never look back, trusting that local optimality composes into a global optimum. Only valid when the problem has the greedy-choice property and optimal substructure — otherwise it silently gives a wrong answer, unlike DP, which always considers every option.",
  recognize: [
    "'Maximum/minimum number of X' with a simple, provable local rule",
    "Interval scheduling (earliest finish time first)",
    "Sorting by some criterion, then a single linear scan, gives the answer",
    "Warning sign: if you can't prove the local choice is always safe, it's probably not actually a greedy problem",
  ],
  template: {
    note: "Jump Game: can you reach the last index, greedily tracking the farthest reachable index.",
    code: `def can_jump(nums):
    max_reach = 0
    for i, n in enumerate(nums):
        if i > max_reach:
            return False
        max_reach = max(max_reach, i + n)
    return True`,
  },
  examples: [
    {
      title: "Gas Station",
      prompt: "Given gas[i] and cost[i] around a circular route, return the starting station index from which you can complete the whole circuit, or -1 if impossible. Guaranteed unique if it exists.",
      code: `def can_complete_circuit(gas, cost):
    if sum(gas) < sum(cost):
        return -1

    total = 0
    start = 0
    for i in range(len(gas)):
        total += gas[i] - cost[i]
        if total < 0:
            start = i + 1
            total = 0
    return start`,
      explanation: "If total gas is at least total cost overall, a valid start is guaranteed to exist. Greedily: whenever the running tank goes negative starting from the current candidate, none of the stations between the old start and i could have been valid starts either — so jump the candidate straight to i+1 and reset.",
      complexity: "Time: O(n) · Space: O(1)",
      complexityWhy: "The array is scanned exactly once, accumulating the running total and candidate start in the same pass, so total work is O(n). Only a few running variables are tracked, none of which grow with n, giving O(1) space.",
    },
    {
      title: "Jump Game II",
      prompt: "Given an array where nums[i] is the max jump length from index i, return the minimum number of jumps to reach the last index.",
      code: `def jump(nums):
    jumps = 0
    curr_end = 0
    farthest = 0
    for i in range(len(nums) - 1):
        farthest = max(farthest, i + nums[i])
        if i == curr_end:
            jumps += 1
            curr_end = farthest
    return jumps`,
      explanation: "This is a greedy BFS-by-levels in disguise. curr_end marks the boundary of the current jump's reach; when i reaches that boundary, another jump is forced, and the next boundary becomes the farthest index reachable from anywhere within the current range.",
      complexity: "Time: O(n) · Space: O(1)",
      complexityWhy: "Each index from 0 to n-2 is visited exactly once to update `farthest`, giving O(n) time. Only three integer variables are tracked regardless of array size, giving O(1) space.",

    "Jump Game",

    "Hand of Straights",
    "Merge Triplets to Form Target Triplet",

      correct: 0,

      correct: 0,

      question: "In Jump Game II, what does curr_end represent during the scan?",
      options: [
        "The farthest index reachable using the jumps taken so far",

      correct: 0,

      ],
      correct: 0,
