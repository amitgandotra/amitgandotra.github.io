    note: "Build once in O(n); answer every range query in O(1).",
    code: `from itertools import accumulate

def build_prefix(nums):
    return [0] + list(accumulate(nums))      # prefix[i] = sum(nums[:i])

def range_sum(prefix, left, right):            # inclusive indexes
    return prefix[right + 1] - prefix[left]

nums = [3, 1, 4, 1, 5]
prefix = build_prefix(nums)
print(range_sum(prefix, 1, 3))    # 1 + 4 + 1 = 6`,

    count = 0
    running = 0
    seen = {0: 1}                       # prefix sum -> how many times it occurred
    for x in nums:
        running += x
        count += seen.get(running - k, 0)     # an earlier prefix that leaves exactly k
        seen[running] = seen.get(running, 0) + 1
    return count`,
      explanation: "A subarray between two prefixes sums to k when <code>prefix[j] - prefix[i] == k</code>, so for each running total look up how many earlier prefixes equal <code>running - k</code>. Seeding the map with <code>{0: 1}</code> counts subarrays that start at index 0. No window logic means negatives are fine.",

    n = len(nums)
    out = [1] * n
    left = 1
    for i in range(n):
        out[i] = left                # product of everything to the left of i
        left *= nums[i]
    right = 1
    for i in range(n - 1, -1, -1):
        out[i] *= right              # multiply by the product of everything to the right
        right *= nums[i]
    return out`,
