  id: "topological-sort",
  summary: "A topological order lists the nodes of a directed acyclic graph so that every edge points forward: each task appears after the tasks it depends on. Kahn's algorithm repeatedly removes nodes with no remaining prerequisites; if it cannot remove them all, the graph has a cycle and no valid order exists.",
  recognize: [
    "<strong>Prerequisites, dependencies, build order</strong>",
    "'Return a valid order' or 'is it possible to finish everything'",

  template: {
    note: "Kahn's algorithm with in-degrees. If the result is shorter than n, there was a cycle.",
    code: `from collections import defaultdict, deque

def topo_order(n, edges):                  # edge (a, b): a must come before b
    graph = defaultdict(list)
    indegree = [0] * n
    for a, b in edges:
        graph[a].append(b)
        indegree[b] += 1
    queue = deque(i for i in range(n) if indegree[i] == 0)
    order = []
    while queue:
        node = queue.popleft()
        order.append(node)
        for nxt in graph[node]:
            indegree[nxt] -= 1             # one prerequisite is now satisfied
            if indegree[nxt] == 0:
                queue.append(nxt)
    return order if len(order) == n else []    # shorter means a cycle`,

def alien_order(words):
    graph = {c: set() for w in words for c in w}
    for a, b in zip(words, words[1:]):
        for x, y in zip(a, b):
            if x != y:
                graph[x].add(y)              # x comes before y
                break
        else:
            if len(a) > len(b):
                return ""                    # "abc" cannot come before "ab"
    indegree = {c: 0 for c in graph}
    for c in graph:

            indegree[nxt] += 1
    queue = deque(c for c in indegree if indegree[c] == 0)
    out = []
    while queue:
        c = queue.popleft()
        out.append(c)
        for nxt in graph[c]:
            indegree[nxt] -= 1
            if indegree[nxt] == 0:
                queue.append(nxt)
    return "".join(out) if len(out) == len(graph) else ""`,
