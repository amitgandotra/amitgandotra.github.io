  id: "backtracking",
  summary: "Systematically explore all candidate solutions by building them incrementally, abandoning a partial candidate the moment it can't possibly lead to a valid solution. It's DFS over a decision tree with an explicit undo step.",
  recognize: [
    "'Generate all...' / 'find all possible...' language: subsets, permutations, combinations",

  ],
  template: {
    note: "The generic choose/explore/unchoose skeleton.",
    code: `def backtrack(path, choices):
    if is_solution(path):
        result.append(path[:])
        return
    for choice in choices:
        if not is_valid(choice, path):
            continue
        path.append(choice)
        backtrack(path, next_choices(choices, choice))
        path.pop()  # undo`,
  },
  examples: [
    {
      title: "Subsets",
      prompt: "Given an array of unique integers, return all possible subsets (the power set).",
      code: `def subsets(nums):
    result = []
    path = []

    def backtrack(start):
        result.append(path[:])
        for i in range(start, len(nums)):
            path.append(nums[i])
            backtrack(i + 1)
            path.pop()

    backtrack(0)
    return result`,
      explanation: "Every recursive call first records the current path as a valid subset (including the empty one), then tries extending it with each remaining element. Passing start forward prevents reusing earlier elements, which avoids generating duplicate subsets.",
      complexity: "Time: O(n * 2^n) — 2^n subsets, O(n) to copy each · Space: O(n) for the recursion/path, excluding output",
      complexityWhy: "There are exactly 2^n subsets of an n-element set, and the algorithm generates all of them; copying each subset into the result costs up to O(n), giving O(n * 2^n) total. The recursion depth and the path array are both bounded by n, giving O(n) auxiliary space excluding the output.",
    },
    {
      title: "Combination Sum",
      prompt: "Given distinct candidates and a target, return all unique combinations that sum to target. A candidate may be reused an unlimited number of times.",
      code: `def combination_sum(candidates, target):
    result = []
    path = []

    def backtrack(start, remaining):
        if remaining == 0:
            result.append(path[:])
            return
        if remaining < 0:
            return
        for i in range(start, len(candidates)):
            path.append(candidates[i])
            backtrack(i, remaining - candidates[i])  # i, not i+1: reuse allowed
            path.pop()

    backtrack(0, target)
    return result`,
      explanation: "Because a number can be reused, the recursive call passes i (not i+1) so the same element stays eligible. The 'remaining < 0' check is the prune — it cuts off a branch the moment it overshoots, instead of exploring further down a doomed path.",
      complexity: "Time: exponential in the worst case, bounded by the number of valid combinations · Space: O(target / min(candidates)) recursion depth",
      complexityWhy: "In the worst case (e.g. candidates = [1] and a large target), the number of valid combinations — and therefore recursive branches explored — grows exponentially with target. The recursion depth is bounded by target divided by the smallest candidate, which is the O(target / min(candidates)) space bound for the call stack.",
