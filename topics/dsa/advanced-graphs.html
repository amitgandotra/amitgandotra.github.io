  id: "advanced-graphs",
  summary: "Weighted graph algorithms: Dijkstra's for shortest paths with non-negative weights, and Union-Find for connectivity and cycle detection as edges are added incrementally. These show up once problems move past 'unweighted, is there a path.'",
  recognize: [
    "Edges have weights/costs, and you need the cheapest/shortest path &rarr; Dijkstra",
    "Need to dynamically merge groups and check 'are these connected' &rarr; Union-Find (Disjoint Set)",
    "Minimum spanning tree language: 'connect all points with minimum total cost'",

  ],
  template: {
    note: "Dijkstra's algorithm using a min-heap as the priority queue.",
    code: `import heapq

def dijkstra(graph, start):
    dist = {start: 0}
    heap = [(0, start)]
    while heap:
        d, node = heapq.heappop(heap)
        if d > dist.get(node, float("inf")):
            continue
        for neighbor, weight in graph[node]:
            nd = d + weight
            if nd < dist.get(neighbor, float("inf")):
                dist[neighbor] = nd
                heapq.heappush(heap, (nd, neighbor))
    return dist`,
  },
  examples: [
    {
      title: "Network Delay Time",
      prompt: "Given directed edges times = [(u, v, w), ...], a source node k, and n nodes total, return the time for all nodes to receive a signal sent from k, or -1 if impossible.",
      code: `import heapq
from collections import defaultdict

def network_delay_time(times, n, k):
    graph = defaultdict(list)
    for u, v, w in times:
        graph[u].append((v, w))

    dist = {}
    heap = [(0, k)]
    while heap:
        d, node = heapq.heappop(heap)
        if node in dist:
            continue
        dist[node] = d
        for neighbor, w in graph[node]:
            if neighbor not in dist:
                heapq.heappush(heap, (d + w, neighbor))

    return max(dist.values()) if len(dist) == n else -1`,
      explanation: "Standard Dijkstra: pop the closest unvisited node, lock in its distance, relax its neighbors. The answer is the time for the last (farthest) node to receive the signal — or -1 if any node never gets reached.",
      complexity: "Time: O(E log V) · Space: O(V + E)",
      complexityWhy: "Each edge can trigger at most one heap push, and each vertex is popped (finalized) at most once; with a binary heap, each push/pop costs O(log V), giving O(E log V) overall. The adjacency list stores all E edges and the distance map stores up to V entries, giving O(V + E) space.",
    },
    {
      title: "Redundant Connection (Union-Find)",
      prompt: "Given edges of an undirected graph added one at a time that would form a tree if not for one extra edge, find that extra edge (the one that creates a cycle).",
      code: `def find_redundant_connection(edges):
    parent = list(range(len(edges) + 1))

    def find(x):
        while parent[x] != x:
            parent[x] = parent[parent[x]]  # path compression
            x = parent[x]
        return x

    def union(a, b):
        ra, rb = find(a), find(b)
        if ra == rb:
            return False  # already connected -> this edge creates a cycle
        parent[ra] = rb
        return True

    for a, b in edges:
        if not union(a, b):
            return [a, b]
    return []`,
      explanation: "Union-Find tracks connected components with near-O(1) amortized operations via path compression. Adding an edge between two nodes already in the same component means that edge is redundant — it closes a cycle.",
      complexity: "Time: O(E * &alpha;(V)), &alpha; = inverse Ackermann, effectively constant · Space: O(V)",
      complexityWhy: "Each of the E edges triggers one union/find pair, and with path compression each find() runs in near-constant amortized time (formally O(&alpha;(V)), the inverse Ackermann function, which is effectively constant for any realistic V). The parent array holds one entry per vertex, giving O(V) space.",
    },
